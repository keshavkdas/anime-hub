<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Profile – AnimeHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #0f0f0f, #1f1f1f);
      color: #f0f0f0;
    }

    .container {
      max-width: 420px;
      margin: 40px auto;
      background-color: #161b22;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #ff6600;
    }

    label {
      display: block;
      margin: 12px 0 4px;
      font-weight: 500;
    }

    input {
      width: 90%;
      padding: 10px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background-color: #0d1117;
      color: #ff6600;
      font-size: 15px;
    }

    .input-hint {
      font-size: 12px;
      color: #999;
      margin-top: 2px;
    }

    .error {
      color: #ff6600;
      font-size: 13px;
      margin-top: 2px;
    }

    .avatar-tray {
      display: flex;
      justify-content: center;
      gap: 10px;
      align-items: center;
      padding: 8px 0;
      overflow: hidden;
    }

    .avatar-bubble {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      opacity: 1;
      transition: all 0.4s ease-in-out;
    }

    .avatar-bubble img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .avatar-bubble.plus {
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
      color: #ff6600;
    }

    .avatar-bubble.blurred-left {
      opacity: 0.4;
      filter: blur(2px);
      transform: scale(0.85);
    }

    .avatar-bubble.selected-center {
      border: 3px solid #ff6600;
      transform: scale(1.1);
      box-shadow: 0 0 10px #ff6600;
      z-index: 2;
    }

    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .avatar-bubble.animate {
      animation: popIn 0.3s ease-in-out;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 16px;
      background-color: #ff6600;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #avatar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 999;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    #avatar-overlay.active {
      display: flex;
    }

    #overlay-box {
      background: #161b22;
      width: 420px;
      max-height: 90vh;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(255, 102, 0, 0.4);
      display: flex;
      flex-direction: column;
    }

    #close-overlay {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #0d1117;
      color: #ff6600;
      border: 1px solid #ff6600;
      font-size: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .avatar-scroll-container {
      max-height: 400px;
      overflow-y: auto;
      flex: 1;
    }

    .overlay-avatars {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    #search-bar {
      margin-bottom: 15px;
      width: 85%;
      margin-left: 5%;
    }

    #loading-spinner {
      text-align: center;
      margin: 10px;
      color: #ff6600;
      display: none;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #161b22;
      color: #ff6600;
      padding: 10px 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(255, 102, 0, 0.5);
      display: none;
      z-index: 1000;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Create Your Profile</h2>

    <label>Select Your Avatar</label>
    <div class="avatar-tray" id="avatar-tray"></div>
    <div class="input-hint">At least one avatar is required</div>
    <div class="error" id="error-avatar"></div>

    <label>Username <span style="color:#ff6600">*</span></label>
    <input type="text" id="username" />
    <div class="input-hint">Must match the one you signed up with</div>
    <div class="error" id="error-username"></div>

    <label>First Name <span style="color:#ff6600">*</span></label>
    <input type="text" id="first-name" />
    <div class="input-hint">Only alphabets allowed</div>
    <div class="error" id="error-first-name"></div>

    <label>Last Name <span style="color:#ff6600">*</span></label>
    <input type="text" id="last-name" />
    <div class="input-hint">Only alphabets allowed</div>
    <div class="error" id="error-last-name"></div>

    <label>Date of Birth <span style="color:#ff6600">*</span></label>
    <input type="text" id="dob" />
    <div class="input-hint">Select from calendar</div>
    <div class="error" id="error-dob"></div>

    <button id="submit-btn" onclick="submitProfile()" disabled>Submit Profile</button>
  </div>

  <div id="avatar-overlay">
    <div id="overlay-box">
      <button id="close-overlay" onclick="toggleOverlay()">✖</button>
      <input type="text" id="search-bar" placeholder="Search for character..." />
      <div class="avatar-scroll-container">
        <div class="overlay-avatars" id="overlay-avatars"></div>
        <div id="loading-spinner">Loading...</div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script>
    let allAvatars = [], selectedAvatars = [], page = 1, isLoading = false;

    const state = { username: false, firstName: false, lastName: false, dob: false, avatar: false };
    const signedUpUsername = JSON.parse(localStorage.getItem("user"))?.username || "";

    flatpickr("#dob", {
      dateFormat: "Y-m-d",
      maxDate: "today",
      allowInput: true
    });

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.style.display = "block";
      setTimeout(() => toast.style.display = "none", 3000);
    }

    async function fetchCharacters(pageNum = 1) {
      const res = await fetch(`https://api.jikan.moe/v4/characters?page=${pageNum}&limit=25&order_by=favorites&sort=desc`);
      const data = await res.json();
      return data.data.map(c => ({ name: c.name, src: c.images.jpg.image_url }));
    }

    function renderTray() {
      const tray = document.getElementById("avatar-tray");
      tray.innerHTML = "";
      const displayAvatars = selectedAvatars.slice(-4);

      displayAvatars.slice(0, -1).forEach(char => {
        const div = document.createElement("div");
        div.className = "avatar-bubble blurred-left animate";
        div.innerHTML = `<img src="${char.src}" alt="${char.name}" title="${char.name}" />`;
        div.onclick = () => {
          selectedAvatars = selectedAvatars.filter(a => a.src !== char.src);
          selectedAvatars.push(char);
          renderTray();
          validateAvatar();
        };
        tray.appendChild(div);
      });

      if (displayAvatars.length) {
        const current = displayAvatars[displayAvatars.length - 1];
        const div = document.createElement("div");
        div.className = "avatar-bubble selected-center animate";
        div.innerHTML = `<img src="${current.src}" alt="${current.name}" title="${current.name}" />`;
        tray.appendChild(div);
      }

      const plus = document.createElement("div");
      plus.className = "avatar-bubble plus animate";
      plus.innerText = "+";
      plus.onclick = toggleOverlay;
      tray.appendChild(plus);
    }

    function toggleOverlay() {
      const ov = document.getElementById("avatar-overlay");
      ov.classList.toggle("active");
      if (ov.classList.contains("active")) {
        page = 1;
        allAvatars = [];
        document.getElementById("overlay-avatars").innerHTML = "";
        loadMoreCharacters();
      }
    }

    async function loadMoreCharacters() {
      if (isLoading) return;
      isLoading = true;
      document.getElementById("loading-spinner").style.display = "block";

      const newChars = await fetchCharacters(page++);
      allAvatars.push(...newChars);
      const container = document.getElementById("overlay-avatars");

      newChars.forEach(char => {
        const div = document.createElement("div");
        div.className = "avatar-bubble";
        div.innerHTML = `<img src="${char.src}" alt="${char.name}" title="${char.name}" />`;
        div.onclick = () => {
          selectedAvatars = selectedAvatars.filter(a => a.src !== char.src);
          selectedAvatars.push(char);
          renderTray();
          validateAvatar();
          toggleOverlay();
        };
        container.appendChild(div);
      });

      document.getElementById("loading-spinner").style.display = "none";
      isLoading = false;
    }

    function validateUsername() {
      const val = document.getElementById("username").value.trim();
      const err = document.getElementById("error-username");
      if (val !== signedUpUsername) {
        err.textContent = `Username must match: "${signedUpUsername}"`;
        state.username = false;
      } else {
        err.textContent = "";
        state.username = true;
      }
      checkFormValidity();
    }

    function validateName(id) {
      const input = document.getElementById(id);
      const val = input.value.trim();
      const err = document.getElementById(`error-${id}`);
      const key = id === "first-name" ? "firstName" : "lastName";
      if (!/^[a-zA-Z]+$/.test(val)) {
        err.textContent = "Only alphabets allowed";
        state[key] = false;
      } else {
        err.textContent = "";
        state[key] = true;
      }
      checkFormValidity();
    }

    function validateDob() {
      const val = document.getElementById("dob").value;
      const err = document.getElementById("error-dob");
      if (!val) {
        err.textContent = "This is a required field";
        state.dob = false;
      } else {
        err.textContent = "";
        state.dob = true;
      }
      checkFormValidity();
    }

    function validateAvatar() {
      const err = document.getElementById("error-avatar");
      if (!selectedAvatars.length) {
        err.textContent = "Please select an avatar";
        state.avatar = false;
      } else {
        err.textContent = "";
        state.avatar = true;
      }
      checkFormValidity();
    }

    function checkFormValidity() {
      document.getElementById("submit-btn").disabled = !Object.values(state).every(Boolean);
    }

    async function submitProfile() {
      if (!Object.values(state).every(Boolean)) return;

      const profile = {
        avatar: selectedAvatars[selectedAvatars.length - 1].src,
        username: document.getElementById("username").value.trim(),
        first: document.getElementById("first-name").value.trim(),
        last: document.getElementById("last-name").value.trim(),
        dob: document.getElementById("dob").value
      };

      localStorage.setItem("profile", JSON.stringify(profile));

      const user = JSON.parse(localStorage.getItem("user"));
      if (user?.uid) {
        await fetch("https://anime-hub-auth.keshavkdas23.workers.dev/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "saveProfile", uid: user.uid, profile })
        });
      }

      sessionStorage.setItem("toast", "🎉 Profile created successfully");
      window.location.href = "index.html";
    }

    document.getElementById("search-bar").addEventListener("input", (e) => {
      const query = e.target.value.toLowerCase();
      document.querySelectorAll("#overlay-avatars .avatar-bubble").forEach(bubble => {
        const name = bubble.querySelector("img").title.toLowerCase();
        bubble.style.display = name.includes(query) ? "block" : "none";
      });
    });

    document.querySelector(".avatar-scroll-container").addEventListener("scroll", (e) => {
      const el = e.target;
      if (el.scrollTop + el.clientHeight >= el.scrollHeight - 50) {
        loadMoreCharacters();
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      renderTray();
      document.getElementById("username").addEventListener("input", validateUsername);
      document.getElementById("first-name").addEventListener("input", () => validateName("first-name"));
      document.getElementById("last-name").addEventListener("input", () => validateName("last-name"));
      document.getElementById("dob").addEventListener("change", validateDob);
      validateAvatar();
    });
  </script>
</body>
</html>
