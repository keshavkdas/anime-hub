<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Profile – AnimeHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #0f0f0f, #1f1f1f);
      color: #f0f0f0;
      overscroll-behavior: contain;
    }

    .container {
      max-width: 420px;
      margin: 50px auto;
      background-color: #161b22;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #ff6600;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-weight: 500;
    }

    input {
      width: 90%;
      padding: 12px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background-color: #0d1117;
      color: #ff6600;
      font-size: 15px;
    }

    .avatar-tray {
      display: flex;
      justify-content: center;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      transition: all 0.3s ease-in-out;
      overflow: hidden;
    }

    .avatar-bubble {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      opacity: 1;
      transition: all 0.4s ease-in-out;
    }

    .avatar-bubble img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .avatar-bubble.plus {
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
      color: #ff6600;
    }
    .avatar-bubble.blurred-left {
      opacity: 0.4;
      filter: blur(2px);
      transform: scale(0.85);
    }

    .avatar-bubble.blurred-left:hover {
      opacity: 1;
      filter: none;
      transform: scale(1.05);
      z-index: 2;
    }

    .avatar-bubble.selected-center {
      border: 3px solid #ff6600;
      transform: scale(1.1);
      box-shadow: 0 0 10px #ff6600;
      z-index: 2;
    }

    .avatar-bubble.blurred-left:hover ~ .selected-center {
      opacity: 0.4;
      filter: blur(2px);
      transform: scale(0.85);
    }

    @keyframes popIn {
      0% {
        transform: scale(0.6);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .avatar-bubble.animate {
      animation: popIn 0.3s ease-in-out;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      background-color: #ff6600;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #avatar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 999;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      overflow: auto;
    }

    #avatar-overlay.active {
      display: flex;
    }

    #overlay-box {
      background: #161b22;
      width: 420px;
      max-width: 500px;
      max-height: 90vh;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(255, 102, 0, 0.4);
      display: flex;
      flex-direction: column;
    }

    #overlay-box input {
      margin-bottom: 15px;
      width: 85%;
      margin-left: 5%;
    }

    #close-overlay {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #0d1117;
      color: #ff6600;
      border: 1px solid #ff6600;
      font-size: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .avatar-scroll-container {
      max-height: 400px;
      overflow-x: hidden;
      flex: 1;
      overflow-y: auto;
    }

    .overlay-avatars {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .avatar-scroll-container::-webkit-scrollbar {
      width: 8px;
      background: black;
    }

    .avatar-scroll-container::-webkit-scrollbar-thumb {
      background-color: #ff6600;
      border-radius: 4px;
    }

    #loading-spinner {
      text-align: center;
      margin: 10px;
      color: #ff6600;
      display: none;
    }

    @media (max-width: 500px) {
      .overlay-avatars {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    input[type="date"] {
      background-color: #0d1117;
      color: #ff6600;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 12px;
      font-size: 15px;
      width: 90%;
      cursor: pointer;
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1) hue-rotate(180deg);
      cursor: pointer;
    }

    input[type="date"]::-moz-focus-inner {
      border: 0;
    }
    .error {
      color: #ff4444;
      font-size: 13px;
      margin-top: 4px;
      height: 16px; /* Prevent layout shift */
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Create Your Profile</h2>
    <label>Select Your Avatar</label>
    <div class="avatar-tray" id="avatar-tray"></div>
    <div class="error" id="error-avatar"></div>
    <label>Username</label>
    <input type="text" id="username" required />
    <div class="error" id="error-username"></div>
    <label>First Name</label>
    <input type="text" id="first-name" required />
    <div class="error" id="error-first-name"></div>
    <label>Last Name</label>
    <input type="text" id="last-name" required />
    <div class="error" id="error-last-name"></div>
    <label>Date of Birth</label>
    <input type="date" id="dob" required onkeydown="return false;" onclick="this.showPicker()" />
    <div class="error" id="error-dob"></div>
    <button onclick="submitProfile()">Submit Profile</button>
  </div>

  <div id="avatar-overlay">
    <div id="overlay-box">
      <button id="close-overlay" onclick="toggleOverlay()">✖</button>
      <input type="text" id="search-bar" placeholder="Search for character..." />
      <div class="avatar-scroll-container">
        <div class="overlay-avatars" id="overlay-avatars"></div>
        <div id="loading-spinner">Loading...</div>
      </div>
    </div>
  </div>

  <script>
    let allAvatars = [];
    let selectedAvatars = [];
    let page = 1;
    let isLoading = false;

    async function fetchCharacters(pageNum = 1) {
      const res = await fetch(`https://api.jikan.moe/v4/characters?page=${pageNum}&limit=25&order_by=favorites&sort=desc`);
      const data = await res.json();
      return data.data.map(c => ({
        name: c.name,
        src: c.images.jpg.image_url
      }));
    }

    function renderTray() {
      const tray = document.getElementById("avatar-tray");
      tray.innerHTML = "";

      const displayAvatars = selectedAvatars.slice(-4);

      displayAvatars.slice(0, -1).forEach((char, index) => {
        const div = document.createElement("div");
        div.className = "avatar-bubble blurred-left animate";
        div.innerHTML = `<img src="${char.src}" alt="${char.name}" title="${char.name}" />`;
        div.onclick = () => {
            selectedAvatars = selectedAvatars.filter(a => a.src !== char.src); // remove from earlier
            selectedAvatars.push(char); // move to center
            renderTray();
            document.getElementById("error-avatar").textContent = "";
        };
        tray.appendChild(div);
      });

      if (displayAvatars.length) {
        const current = displayAvatars[displayAvatars.length - 1];
        const div = document.createElement("div");
        div.className = "avatar-bubble selected-center animate";
        div.innerHTML = `<img src="${current.src}" alt="${current.name}" title="${current.name}" />`;
        tray.appendChild(div);
      }

      const plus = document.createElement("div");
      plus.className = "avatar-bubble plus animate";
      plus.innerText = "+";
      plus.onclick = toggleOverlay;
      tray.appendChild(plus);
    }

    function toggleOverlay() {
      const ov = document.getElementById("avatar-overlay");
      ov.classList.toggle("active");
      if (ov.classList.contains("active")) {
        page = 1;
        allAvatars = [];
        document.getElementById("overlay-avatars").innerHTML = "";
        loadMoreCharacters().then(() => loadMoreCharacters());
      }
    }

    function showLoading(show = true) {
      document.getElementById("loading-spinner").style.display = show ? "block" : "none";
    }

    async function loadMoreCharacters() {
      if (isLoading) return;
      isLoading = true;
      showLoading(true);

      const newChars = await fetchCharacters(page++);
      allAvatars.push(...newChars);

      const container = document.getElementById("overlay-avatars");
      newChars.forEach(char => {
        const div = document.createElement("div");
        div.className = "avatar-bubble";
        div.innerHTML = `<img src="${char.src}" alt="${char.name}" title="${char.name}" />`;
        div.onclick = () => {
          selectedAvatars = selectedAvatars.filter(a => a.src !== char.src); // remove if exists
          selectedAvatars.push(char); // add to end (center)
          renderTray();
          document.getElementById("error-avatar").textContent = "";
          toggleOverlay();
        };
        container.appendChild(div);
      });

      showLoading(false);
      isLoading = false;
    }

    function submitProfile() {
      const u = document.getElementById("username").value.trim();
      const f = document.getElementById("first-name").value.trim();
      const l = document.getElementById("last-name").value.trim();
      const dob = document.getElementById("dob").value;
      let valid = true;

      const showError = (id, condition) => {
        const el = document.getElementById(`error-${id}`);
        if (!condition) {
          el.textContent = "This is a required field";
          valid = false;
        } else {
          el.textContent = "";
        }
      };

      showError("username", u);
      showError("first-name", f);
      showError("last-name", l);
      showError("dob", dob);
      showError("avatar", selectedAvatars.length > 0);

      if (!valid) return;
      
      const profile = {
        avatar: selectedAvatars[selectedAvatars.length - 1].src,
        username: u,
        first: f,
        last: l,
        dob
      };
      localStorage.setItem("profile", JSON.stringify(profile));
      window.location.href = "index.html";
    }

    document.getElementById("search-bar").addEventListener("input", (e) => {
      const query = e.target.value.toLowerCase();
      document.querySelectorAll("#overlay-avatars .avatar-bubble").forEach(bubble => {
        const name = bubble.querySelector("img").title.toLowerCase();
        bubble.style.display = name.includes(query) ? "block" : "none";
      });
    });

    document.querySelector(".avatar-scroll-container").addEventListener("scroll", (e) => {
      const el = e.target;
      if (el.scrollTop + el.clientHeight >= el.scrollHeight - 50) {
        loadMoreCharacters();
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      renderTray(); // Initial only +
    });
  </script>
</body>
</html>
