<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Profile – AnimeHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body,html{margin:0;padding:0;font-family:Inter,sans-serif;background:#111;color:#eee;}
    .container{max-width:480px;margin:2rem auto;padding:20px;background:#161b22;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,0.5);}
    h1{text-align:center;color:#ffa500;}
    .section{margin-bottom:20px;}
    label{display:block;margin-bottom:6px;font-weight:600;}
    input{width:100%;padding:10px;margin-bottom:10px;border-radius:6px;border:1px solid #30363d;background:#0d1117;color:#eee;}
    .avatars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
    .avatar{width:80px;height:80px;border:2px solid #333;border-radius:50%;overflow:hidden;cursor:pointer;transition:transform .2s;}
    .avatar.selected{border-color:#ffa500;transform:scale(1.1);}
    .avatar img{width:100%;height:100%;object-fit:cover;}
    .avatar.plus{display:flex;align-items:center;justify-content:center;font-size:2rem;color:#ffa500;background:#000;}
    .btn{width:100%;padding:12px;background:#ffa500;color:#111;border:none;border-radius:6px;font-size:16px;cursor:pointer;transition:background .2s;}
    .btn:hover{background:#e69500;}
  </style>
</head>
<body>
  <div class="container">
    <h1>Create Profile</h1>
    <div class="section">
      <label for="fname">First Name</label>
      <input id="fname" type="text">
      <label for="lname">Last Name</label>
      <input id="lname" type="text">
      <label for="dob">Date of Birth</label>
      <input id="dob" type="date">
    </div>
    <div class="section">
      <label>Select Avatar</label>
      <div class="avatars" id="avatars">
        <!-- Example avatars -->
        <div class="avatar"><img src="https://via.placeholder.com/80?text=Goku"></div>
        <div class="avatar"><img src="https://via.placeholder.com/80?text=Saitama"></div>
        <div class="avatar"><img src="https://via.placeholder.com/80?text=Gojo"></div>
        <div class="avatar"><img src="https://via.placeholder.com/80?text=Naruto"></div>
        <div class="avatar"><img src="https://via.placeholder.com/80?text=Luffy"></div>
        <div class="avatar"><img src="https://via.placeholder.com/80?text=Ichigo"></div>
        <div class="avatar"><img src="https://via.placeholder.com/80?text=Tanjiro"></div>
        <div class="avatar"><img src="https://via.placeholder.com/80?text=Levi"></div>
        <div class="avatar"><img src="https://via.placeholder.com/80?text=Eren"></div>
        <div class="avatar plus" id="loadMore">+</div>
      </div>
    </div>
    <div class="section">
      <button class="btn" onclick="submitProfile()">Submit Profile</button>
    </div>
  </div>

  <script>
    const avatars = document.querySelectorAll('.avatar');
    let selected = null;
    avatars.forEach(el => {
      if(el.id === 'loadMore') return;
      el.addEventListener('click', () => {
        if(selected) selected.classList.remove('selected');
        el.classList.add('selected');
        selected = el;
      });
    });

    document.getElementById('loadMore').addEventListener('click', () => {
      alert('Load more avatars...');
      // You can dynamically append more avatar elements here...
    });

    function submitProfile(){
      const fname = document.getElementById('fname').value;
      const lname = document.getElementById('lname').value;
      const dob = document.getElementById('dob').value;
      const avatar = selected?.querySelector('img').src;
      if(!fname || !lname || !dob || !avatar){
        alert('Please complete all fields and select an avatar.');
        return;
      }
      // Submit profile data (e.g., via fetch to your backend), then redirect:
      console.log({ fname, lname, dob, avatar });
      alert('Profile created! Redirecting to dashboard...');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
