<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Profile - AnimeHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f0f0f, #1f1f1f);
      color: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .profile-container {
      background: #161b22;
      padding: 40px;
      border-radius: 12px;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    h2 {
      margin-top: 0;
      color: #fff;
      text-align: center;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    input, select {
      padding: 14px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      font-size: 15px;
    }

    input:focus {
      border-color: #ff6600;
      outline: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 10px;
    }

    .bubble {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: #0d1117;
      border: 3px solid transparent;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.3s ease;
    }

    .bubble img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bubble.selected {
      border-color: #ff6600;
    }

    .bubble.plus {
      font-size: 32px;
      font-weight: bold;
      color: #ff6600;
      background: #000;
    }

    button {
      padding: 14px;
      background: #ff6600;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #e65c00;
    }

    @media (max-width: 600px) {
      .profile-container {
        padding: 20px;
      }
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="profile-container">
    <h2>Create Your Profile</h2>
    <form id="profile-form">
      <input type="text" id="username" placeholder="Username" required />
      <input type="text" id="first-name" placeholder="First Name" required />
      <input type="text" id="last-name" placeholder="Last Name" required />
      <input type="date" id="dob" required />
      <div>
        <label>Select your avatar:</label>
        <div class="grid" id="avatar-grid"></div>
      </div>
      <button type="submit">Save Profile</button>
    </form>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const grid = document.getElementById("avatar-grid");
      let offset = 0;
      let selectedAvatar = null;

      async function fetchCharacters() {
        const res = await fetch(`https://api.jikan.moe/v4/characters?limit=9&offset=${offset}&order_by=favorites&sort=desc`);
        const json = await res.json();
        return (json.data || []).filter(c =>
          c.name && c.images?.jpg?.image_url && !c.name.toLowerCase().includes("dog") && !c.name.toLowerCase().includes("cat") && !c.name.toLowerCase().includes("bear")
        );
      }

      function renderCharacters(characters) {
        characters.forEach(c => {
          const bubble = document.createElement("div");
          bubble.className = "bubble";
          bubble.innerHTML = `<img src="${c.images.jpg.image_url}" title="${c.name}">`;
          bubble.onclick = () => {
            document.querySelectorAll(".bubble").forEach(b => b.classList.remove("selected"));
            bubble.classList.add("selected");
            selectedAvatar = {
              id: c.mal_id,
              name: c.name,
              image: c.images.jpg.image_url
            };
          };
          grid.appendChild(bubble);
        });

        const plus = document.createElement("div");
        plus.className = "bubble plus";
        plus.textContent = "+";
        plus.onclick = () => {
          plus.remove();
          offset += 9;
          fetchCharacters().then(renderCharacters);
        };
        grid.appendChild(plus);
      }

      fetchCharacters().then(renderCharacters);

      document.getElementById("profile-form").onsubmit = e => {
        e.preventDefault();
        const user = {
          username: document.getElementById("username").value.trim(),
          firstName: document.getElementById("first-name").value.trim(),
          lastName: document.getElementById("last-name").value.trim(),
          dob: document.getElementById("dob").value,
          avatar: selectedAvatar
        };

        if (!user.avatar) {
          alert("Please select an avatar.");
          return;
        }

        // Save to localStorage for now; backend integration can be added later
        localStorage.setItem("profile", JSON.stringify(user));
        window.location.href = "index.html";
      };
    });
  </script>
</body>
</html>
