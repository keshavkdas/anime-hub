<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Profile – AnimeHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f0f0f, #1f1f1f);
      color: #f0f0f0;
      display: flex; align-items: center; justify-content: center;
    }
    .container {
      background: #161b22;
      padding: 24px;
      border-radius: 10px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    h1 {
      margin: 0 0 16px;
      color: #ffa500;
      text-align: center;
      font-size: 1.5rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .bubble, .bubble.plus {
      width: 70px; height: 70px;
      background: #111;
      border: 2px solid #333;
      border-radius: 50%;
      display: flex;
      align-items: center; justify-content: center;
      cursor: pointer;
      overflow: hidden;
      transition: border-color .2s;
    }
    .bubble img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .bubble.selected {
      border-color: #ffa500;
    }
    .bubble.plus {
      font-size: 30px;
      color: #ffa500;
    }
    form { max-width: 100%; }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block; margin-bottom: 6px;
      font-size: 0.9rem;
    }
    input[type="text"], input[type="date"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #0d1117;
      color: #f0f0f0;
      font-size: 0.95rem;
    }
    button.submit {
      background: #ffa500;
      color: #111;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background .2s ease;
    }
    button.submit:hover {
      background: #e68a00;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Select Your Character</h1>
  <div class="grid" id="avatar-grid"></div>

  <form id="profile-form">
    <div class="form-group"><label>First Name</label><input type="text" id="first-name" required></div>
    <div class="form-group"><label>Last Name</label><input type="text" id="last-name" required></div>
    <div class="form-group"><label>Date of Birth</label><input type="date" id="dob" required></div>
    <button type="submit" class="submit">Complete Profile</button>
  </form>
</div>

<script>
  const grid = document.getElementById('avatar-grid');
  let offset = 0, selected = null;

  async function fetchChars(off=0) {
    const res = await fetch(`https://api.jikan.moe/v4/characters?order_by=popularity&sort=desc&limit=9&offset=${off}`);
    const json = await res.json();
    return json.data.filter(c => !c.nickname?.toLowerCase().includes('animal'));
  }

  function display(chars) {
    grid.innerHTML = '';
    chars.forEach(c => {
      const b = document.createElement('div');
      b.className = 'bubble';
      const img = document.createElement('img');
      img.src = c.images.jpg.image_url;
      img.title = c.name;
      b.appendChild(img);
      b.onclick = () => {
        grid.querySelectorAll('.bubble').forEach(x => x.classList.remove('selected'));
        b.classList.add('selected');
        selected = c.mal_id;
      };
      grid.appendChild(b);
    });
    const plus = document.createElement('div');
    plus.className = 'bubble plus';
    plus.innerText = '+';
    plus.onclick = () => {
      offset += 9;
      fetchChars(offset).then(display);
    };
    grid.appendChild(plus);
  }

  fetchChars().then(display);

  document.getElementById('profile-form').onsubmit = e => {
    e.preventDefault();
    if (!selected) return alert('Please select a character');
    const p = {
      avatar: selected,
      firstName: e.target['first-name'].value.trim(),
      lastName: e.target['last-name'].value.trim(),
      dob: e.target.dob.value
    };
    localStorage.setItem('profile', JSON.stringify(p));
    window.location.href = 'index.html';
  };
</script>

</body>
</html>
