<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Profile – AnimeHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #0f0f0f, #1f1f1f);
      color: #f0f0f0;
    }

    .container {
      max-width: 420px;
      margin: 50px auto;
      background-color: #161b22;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #ff6600;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background-color: #0d1117;
      color: #fff;
      font-size: 15px;
    }

    input::placeholder {
      color: #ff6600;
    }

    .avatar-tray {
      display: flex;
      gap: 10px;
      flex-wrap: nowrap;
      margin: 15px 0;
      overflow-x: auto;
      justify-content: center;
      align-items: center;
    }

    .avatar-bubble {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      transition: border 0.3s;
      flex-shrink: 0;
    }

    .avatar-bubble.selected {
      border: 3px solid #ff6600;
    }

    .avatar-bubble img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .avatar-bubble.plus {
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
      color: #ff6600;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      background-color: #ff6600;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #avatar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 999;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    #avatar-overlay.active {
      display: flex;
    }

    #overlay-box {
      background: #161b22;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      padding: 20px;
      border-radius: 10px;
      overflow-y: auto;
      box-shadow: 0 0 15px rgba(255, 102, 0, 0.4);
    }

    #overlay-box input {
      margin-bottom: 15px;
      width: 100%;
    }

    .overlay-avatars {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    #close-overlay {
      background: transparent;
      border: none;
      font-size: 18px;
      color: #ff6600;
      float: right;
      cursor: pointer;
    }

    @media (max-width: 500px) {
      .overlay-avatars {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Create Your Profile</h2>
    <label>Select Your Avatar</label>
    <div class="avatar-tray" id="avatar-tray"></div>
    <label>Username</label>
    <input type="text" id="username" placeholder="Enter your username" required />
    <label>First Name</label>
    <input type="text" id="first-name" placeholder="Enter your first name" required />
    <label>Last Name</label>
    <input type="text" id="last-name" placeholder="Enter your last name" required />
    <label>Date of Birth</label>
    <input type="date" id="dob" required />
    <button onclick="submitProfile()">Submit Profile</button>
  </div>

  <div id="avatar-overlay">
    <div id="overlay-box">
      <button id="close-overlay" onclick="toggleOverlay()">✖</button>
      <input type="text" id="search-bar" placeholder="Search for character..." />
      <div class="overlay-avatars" id="overlay-avatars"></div>
    </div>
  </div>

  <script>
    let avatars = [];
    let selectedAvatar = null;
    let page = 1;
    let isLoading = false;

    async function fetchCharacters(pageNum = 1) {
      const res = await fetch(`https://api.jikan.moe/v4/characters?page=${pageNum}&limit=24&order_by=favorites&sort=desc`);
      const data = await res.json();
      return data.data.map(c => ({
        name: c.name,
        src: c.images.jpg.image_url
      }));
    }

    async function initTray() {
      avatars = await fetchCharacters(1);
      renderTray(avatars.slice(0, 5));
    }

    function renderTray(list) {
      const tray = document.getElementById("avatar-tray");
      tray.innerHTML = "";

      list.forEach(char => {
        const div = document.createElement("div");
        div.className = "avatar-bubble";
        div.innerHTML = `<img src="${char.src}" alt="${char.name}" title="${char.name}">`;
        if (selectedAvatar === char.src) div.classList.add("selected");
        div.onclick = () => { selectedAvatar = char.src; renderTray(list); };
        tray.appendChild(div);
      });

      const plus = document.createElement("div");
      plus.className = "avatar-bubble plus";
      plus.innerText = "+";
      plus.onclick = toggleOverlay;
      tray.appendChild(plus);
    }

    function toggleOverlay() {
      const ov = document.getElementById("avatar-overlay");
      ov.classList.toggle("active");
      if (ov.classList.contains("active")) {
        page = 1;
        document.getElementById("overlay-avatars").innerHTML = "";
        loadMoreCharacters();
      }
    }

    async function loadMoreCharacters() {
      if (isLoading) return;
      isLoading = true;
      const more = await fetchCharacters(page++);
      more.forEach(char => {
        const div = document.createElement("div");
        div.className = "avatar-bubble";
        div.innerHTML = `<img src="${char.src}" alt="${char.name}" title="${char.name}">`;
        if (selectedAvatar === char.src) div.classList.add("selected");
        div.onclick = () => {
          selectedAvatar = char.src;
          renderTray(avatars.slice(0, 5));
          toggleOverlay();
        };
        document.getElementById("overlay-avatars").appendChild(div);
      });
      isLoading = false;
    }

    function submitProfile() {
      const u = document.getElementById("username").value.trim();
      const f = document.getElementById("first-name").value.trim();
      const l = document.getElementById("last-name").value.trim();
      const dob = document.getElementById("dob").value;
      if (!selectedAvatar || !u || !f || !l || !dob) {
        return alert("Complete all fields and select an avatar.");
      }
      const profile = { avatar: selectedAvatar, username: u, first: f, last: l, dob };
      localStorage.setItem("profile", JSON.stringify(profile));
      window.location.href = "index.html";
    }

    // Search support
    document.getElementById("search-bar").addEventListener("input", (e) => {
      const query = e.target.value.toLowerCase();
      document.querySelectorAll("#overlay-avatars .avatar-bubble").forEach(bubble => {
        const name = bubble.querySelector("img").title.toLowerCase();
        bubble.style.display = name.includes(query) ? "block" : "none";
      });
    });

    // Infinite scroll
    document.getElementById("overlay-box").addEventListener("scroll", (e) => {
      const el = e.target;
      if (el.scrollTop + el.clientHeight >= el.scrollHeight - 50) {
        loadMoreCharacters();
      }
    });

    initTray();
  </script>
</body>
</html>
