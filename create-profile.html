<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Profile – AnimeHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f0f0f, #1f1f1f);
      color: #f0f0f0;
      padding: 40px 20px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background: #161b22;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    h2 {
      text-align: center;
      color: #ffa500;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #fff;
      font-size: 15px;
    }

    input:focus, select:focus {
      border-color: #ff6600;
      outline: none;
    }

    .avatars {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.2s ease, border 0.2s ease;
    }

    .avatar.selected {
      border: 2px solid #ff6600;
      transform: scale(1.1);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    button {
      margin-top: 24px;
      width: 100%;
      padding: 14px;
      background: #ff6600;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #e65c00;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Create Your Profile</h2>
    <label>Select Avatar</label>
    <div class="avatars" id="avatar-list">
      <div class="avatar" data-avatar="avatar1.png"><img src="avatars/avatar1.png" /></div>
      <div class="avatar" data-avatar="avatar2.png"><img src="avatars/avatar2.png" /></div>
      <div class="avatar" data-avatar="avatar3.png"><img src="avatars/avatar3.png" /></div>
      <div class="avatar" data-avatar="avatar4.png"><img src="avatars/avatar4.png" /></div>
    </div>

    <label>Username</label>
    <input id="username" type="text" placeholder="Your username" required />

    <label>First Name</label>
    <input id="first-name" type="text" placeholder="First name" required />

    <label>Last Name</label>
    <input id="last-name" type="text" placeholder="Last name" required />

    <label>Date of Birth</label>
    <input id="dob" type="date" required />

    <button onclick="submitProfile()">Create Profile</button>
  </div>

  <script>
    let selected = null;
    const avatars = document.querySelectorAll('.avatar');

    avatars.forEach(a => {
      a.addEventListener('click', () => {
        avatars.forEach(av => av.classList.remove('selected'));
        a.classList.add('selected');
        selected = a.dataset.avatar;
      });
    });

    function submitProfile() {
      const profile = {
        avatar: selected,
        username: document.getElementById('username').value.trim(),
        firstName: document.getElementById('first-name').value.trim(),
        lastName: document.getElementById('last-name').value.trim(),
        dob: document.getElementById('dob').value
      };

      if (!profile.avatar || !profile.username || !profile.firstName || !profile.lastName || !profile.dob) {
        alert("Please complete all fields and select an avatar.");
        return;
      }

      localStorage.setItem("profile", JSON.stringify(profile));
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
