<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Release Calendar | AnimeHub</title>
  <style>
    body { margin:0; background:#121212; color:#fff; font-family:sans-serif; }
    header { background:#1f1f1f; padding:1rem; display:flex; justify-content:center; }
    .calendar-container { padding:2rem; display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:1rem; }
    .month { background:#1f1f1f; padding:1rem; border-radius:8px; }
    .month h3 { margin:0 0 .5rem; color:#f97316; }
    .entry { margin-bottom:0.3rem; font-size:0.9rem; }
    .type-tag { font-weight:bold; }
  </style>
</head>
<body>

<header><h2>Release Calendar • 2025</h2></header>
<div class="calendar-container" id="calendar"></div>

<script>
  const monthNames = [
    'January','February','March','April','May','June',
    'July','August','September','October','November','December'
  ];
  const byMonth = Array.from({ length: 12 }, () => []);

  async function fetchJikan(path, dateKey, type) {
    try {
      const r = await fetch(`https://api.jikan.moe/v4/${path}`);
      const json = await r.json();
      console.log(`Fetched ${type}:`, json.data.length);
      json.data.forEach(item => {
        const raw = dateKey.reduce((o,k)=>o?.[k], item);
        if (!raw) return;
        const d = new Date(raw);
        if (isNaN(d)) return;
        byMonth[d.getMonth()].push({
          title: item.title,
          type,
          date: d.toDateString()
        });
      });
    } catch (e) {
      console.error(`Error loading ${type}:`, e);
    }
  }

  async function fetchAniListManhwa() {
    try {
      const query = `
        query {
          Page(perPage:50) {
            media(type:MANGA, format:MANGA, sort:POPULARITY_DESC, genre_in:["Manhwa"]) {
              title { romaji }
              startDate { year month day }
            }
          }
        }`;
      const r = await fetch('https://graphql.anilist.co', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ query })
      });
      const json = await r.json();
      console.log('Fetched Manhwa:', json.data.Page.media.length);
      json.data.Page.media.forEach(m => {
        const sd = m.startDate;
        if (!sd.year || !sd.month || !sd.day) return;
        const d = new Date(sd.year, sd.month-1, sd.day);
        byMonth[d.getMonth()].push({
          title: m.title.romaji,
          type: 'Manhwa',
          date: d.toDateString()
        });
      });
    } catch (e) {
      console.error('AniList error:', e);
    }
  }

  function render() {
    const con = document.getElementById('calendar');
    con.innerHTML = '';
    monthNames.forEach((name, idx) => {
      const mbox = document.createElement('div');
      mbox.className = 'month';
      mbox.innerHTML = `<h3>${name}</h3>`;
      const arr = byMonth[idx];
      if (arr.length === 0) {
        mbox.innerHTML += `<p style="opacity:.5">No releases data.</p>`;
      } else {
        arr.sort((a,b)=> new Date(a.date) - new Date(b.date));
        arr.forEach(e => {
          const p = document.createElement('div');
          p.className = 'entry';
          p.innerHTML = `<span class="type-tag">[${e.type}]</span> ${e.date}: ${e.title}`;
          mbox.appendChild(p);
        });
      }
      con.appendChild(mbox);
    });
  }

  async function init() {
    await fetchJikan('seasons/upcoming', ['aired','from'], 'Anime');
    await fetchJikan('manga?order_by=publishing_start&sort=asc&type=manga', ['published','from'], 'Manga');
    await fetchAniListManhwa();
    render();
  }

  init();
</script>

</body>
</html>
