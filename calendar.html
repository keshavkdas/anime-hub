<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Release Calendar| AnimeHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #121212;
      color: #fff;
      font-family: 'Poppins', sans-serif;
    }

    header {
      background: #1f1f1f;
      padding: 1.1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      border-bottom: 2px solid #333;
    }

    header h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 2rem;
      color: #f97316;
      margin: 0;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    nav {
      display: flex;
      align-items: center;
    }

    nav a {
      color: white;
      margin-left: 2rem;
      font-family: 'Poppins', sans-serif;
      font-size: 1.5rem;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: #f97316;
    }

    nav a:last-child {
      font-size: 1.3rem;
      line-height: 1;
    }
    nav a.active {
      color: #f97316;
      border-bottom: 2px solid #f97316;
    }

    .calendar-container {
      padding: 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }

    .month {
      background: #1f1f1f;
      border-radius: 8px;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      transition: all 0.3s ease;
      max-height: 180px;
      position: relative;
    }

    .month.expanded {
      max-height: 1000px;
    }

    .month h3 {
      margin: 0;
      font-size: 1rem;
      padding: 0.8rem;
      background: #262626;
      color: #f97316;
      cursor: pointer;
      border-bottom: 1px solid #333;
    }

    .month h3:hover {
      background: #333;
    }

    .month .entry {
      font-size: 0.85rem;
      padding: 0.4rem 0.8rem;
      border-bottom: 1px solid #222;
      line-height: 1.4;
    }

    .anime { color: #f97316; font-weight: bold; }
    .manga { color: #34d399; font-weight: bold; }
    .manhwa { color: #60a5fa; font-weight: bold; }

    .entry .meta {
      color: #aaa;
      font-size: 0.75rem;
    }

    footer {
      text-align: center;
      color: #888;
      padding: 1rem;
      font-size: 0.85rem;
    }

    @media (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }

      nav {
        margin-top: 0.5rem;
        flex-wrap: wrap;
      }

      nav a {
        margin-left: 1rem;
        margin-bottom: 0.5rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>AnimeHub</h1>
    <nav>
      <a href="index.html">Anime</a>
      <a href="browse.html">Browse</a>
      <a href="schedule.html">Schedule</a>
      <a href="/manga.html">Manga</a>
      <a href="/manhwa.html">Manhwa</a>
      <a href="favorites.html">❤️</a>
    </nav>
  </header>

  <div class="calendar-container" id="calendar">
    <p style="color:#bbb;">📅 Loading release calendar...</p>
  </div>

  <footer>
    Powered by Gemini API & Cloudflare Workers · Data auto-refreshes daily
  </footer>

  <script type="module" src="calendar.js"></script>
</body>
</html>
