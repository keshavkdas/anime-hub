<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Release Calendar | AnimeHub</title>
  <style>
    body {
      margin: 0;
      background: #121212;
      color: #fff;
      font-family: sans-serif;
    }
    header {
      background: #1f1f1f;
      padding: 1rem;
      display: flex;
      justify-content: center;
    }
    .calendar-container {
      padding: 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1rem;
    }
    .month {
      background: #1f1f1f;
      padding: 1rem;
      border-radius: 8px;
    }
    .month h3 {
      margin: 0 0 0.5rem;
      color: #f97316;
    }
    .entry {
      margin-bottom: 0.3rem;
      font-size: 0.9rem;
    }
    .type-tag {
      font-weight: bold;
    }
  </style>
</head>
<body>

<header><h2>Release Calendar • 2025</h2></header>
<div class="calendar-container" id="calendar"></div>

<script>
  const monthNames = [
    'January','February','March','April','May','June',
    'July','August','September','October','November','December'
  ];
  const byMonth = Array.from({ length: 12 }, () => []);

  async function fetchJikan(path, dateKey, type) {
    try {
      const res = await fetch(`https://api.jikan.moe/v4/${path}`);
      const json = await res.json();

      if (!json.data || !Array.isArray(json.data)) {
  console.warn(`No valid data for ${type}`, json);
  return;
}
console.log(`Fetched ${type}:`, json.data.length);


      json.data.forEach(item => {
        const raw = dateKey.reduce((o, k) => o?.[k], item);
        if (!raw) return;
        const d = new Date(raw);
        if (isNaN(d)) return;
        byMonth[d.getMonth()].push({
          title: item.title,
          type,
          date: d.toDateString()
        });
      });
    } catch (e) {
      console.error(`Error fetching ${type}:`, e);
    }
  }

  async function fetchJikanManga() {
    try {
      const res = await fetch("https://api.jikan.moe/v4/manga?order_by=publishing_start&sort=asc&type=manga&limit=30");
      const json = await res.json();

      if (!json.data || !Array.isArray(json.data)) {
        console.warn("No manga data:", json);
        return;
      }

      json.data.forEach(item => {
        const raw = item.published?.from;
        if (!raw) return;
        const d = new Date(raw);
        if (isNaN(d)) return;
        byMonth[d.getMonth()].push({
          title: item.title,
          type: 'Manga',
          date: d.toDateString()
        });
      });
    } catch (e) {
      console.error("Error fetching Manga:", e);
    }
  }

  async function fetchAniListManhwa() {
    try {
      const query = `
        query {
          Page(perPage: 50) {
            media(type: MANGA, format: MANGA, sort: POPULARITY_DESC, genre_in: ["Manhwa"]) {
              title { romaji }
              startDate { year month day }
            }
          }
        }`;

      const res = await fetch("https://graphql.anilist.co", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query })
      });

      const json = await res.json();
      if (!json.data?.Page?.media) {
        console.warn("No manhwa data:", json);
        return;
      }

      json.data.Page.media.forEach(item => {
        const { year, month, day } = item.startDate || {};
        if (!year || !month || !day) return;
        const d = new Date(year, month - 1, day);
        if (isNaN(d)) return;
        byMonth[d.getMonth()].push({
          title: item.title.romaji,
          type: 'Manhwa',
          date: d.toDateString()
        });
      });
    } catch (e) {
      console.error("Error fetching Manhwa:", e);
    }
  }

  function render() {
    const container = document.getElementById('calendar');
    container.innerHTML = '';

    monthNames.forEach((name, idx) => {
      const box = document.createElement('div');
      box.className = 'month';
      box.innerHTML = `<h3>${name}</h3>`;
      const entries = byMonth[idx];

      if (entries.length === 0) {
        box.innerHTML += `<p style="opacity: 0.5">No releases data.</p>`;
      } else {
        entries.sort((a, b) => new Date(a.date) - new Date(b.date));
        entries.forEach(entry => {
          const div = document.createElement('div');
          div.className = 'entry';
          div.innerHTML = `<span class="type-tag">[${entry.type}]</span> ${entry.date}: ${entry.title}`;
          box.appendChild(div);
        });
      }

      container.appendChild(box);
    });
  }

  async function init() {
  await fetchJikan('seasons/upcoming', ['aired', 'from'], 'Anime'); // Anime
  await fetchJikanManga(); // Manga (custom function)
  await fetchAniListManhwa(); // Manhwa (AniList)
  render();
}

  init();
</script>

</body>
</html>
