<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>2025 Release Calendar | AnimeHub</title>
  <style>
    body {
      margin: 0;
      background: #121212;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    header {
      background: #1f1f1f;
      padding: 1.2rem;
      text-align: center;
      border-bottom: 2px solid #333;
    }

    header h1 {
      margin: 0;
      font-size: 1.6rem;
      color: #f97316;
    }

    .controls {
      text-align: center;
      margin: 1rem 0;
    }

    .controls button {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      background-color: #f97316;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .controls button:hover {
      background-color: #ea580c;
    }

    .calendar-container {
      padding: 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }

    .month {
      background: #1f1f1f;
      border-radius: 8px;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      transition: all 0.3s ease;
      max-height: 180px;
      position: relative;
    }

    .month.expanded {
      max-height: 1000px;
    }

    .month h3 {
      margin: 0;
      font-size: 1rem;
      padding: 0.8rem;
      background: #262626;
      color: #f97316;
      cursor: pointer;
      border-bottom: 1px solid #333;
    }

    .month h3:hover {
      background: #333;
    }

    .month .entry {
      font-size: 0.85rem;
      padding: 0.4rem 0.8rem;
      border-bottom: 1px solid #222;
      line-height: 1.4;
    }

    .anime { color: #f97316; font-weight: bold; }
    .manga { color: #34d399; font-weight: bold; }
    .manhwa { color: #60a5fa; font-weight: bold; }

    .entry .meta {
      color: #aaa;
      font-size: 0.75rem;
    }

    footer {
      text-align: center;
      color: #888;
      padding: 1rem;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>AnimeHub • 2025 Release Calendar</h1>
  </header>

  <div class="controls">
    <button id="zoomBtn">🔍 Toggle Full Width</button>
  </div>

  <div class="calendar-container" id="calendar">
    <p style="color:#bbb;">📅 Loading release calendar...</p>
  </div>

  <footer>
    Powered by Gemini API & Cloudflare Workers · Data auto-refreshes daily
  </footer>

  <script type="module" src="calendar.js"></script>
</body>
</html>
