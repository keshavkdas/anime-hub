<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Release Calendar| AnimeHub</title>
  <link rel="stylesheet" href="responsive.css" />
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #121212;
      color: #fff;
      font-family: 'Poppins', sans-serif;
    }

      header {
      background-color: #1f1f1f;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 2rem;
      color: #f97316;
    }

    nav a {
      color: white;
      margin-left: 2rem;
      font-family: 'Poppins', sans-serif;
      text-decoration: none;
      font-weight: 600;
    }

    nav a[href="calendar.html"] {
      color: #f97316;
    }
    
    nav a:hover {
      color: #f97316;
    }
    
    .calendar-container {
      padding: 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }

    .month {
      background: #1f1f1f;
      border-radius: 8px;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      transition: all 0.3s ease;
      max-height: 180px;
      position: relative;
    }

    .month.expanded {
      max-height: 1000px;
    }

    .month h3 {
      margin: 0;
      font-size: 1rem;
      padding: 0.8rem;
      background: #262626;
      color: #f97316;
      cursor: pointer;
      border-bottom: 1px solid #333;
    }

    .month h3:hover {
      background: #333;
    }

    .month .entry {
      font-size: 0.85rem;
      padding: 0.4rem 0.8rem;
      border-bottom: 1px solid #222;
      line-height: 1.4;
    }

    .anime { color: #f97316; font-weight: bold; }
    .manga { color: #34d399; font-weight: bold; }
    .manhwa { color: #60a5fa; font-weight: bold; }

    .entry .meta {
      color: #aaa;
      font-size: 0.75rem;
    }

    footer {
      text-align: center;
      color: #888;
      padding: 1rem;
      font-size: 0.85rem;
    }

    @media (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }

      nav {
        margin-top: 0.5rem;
        flex-wrap: wrap;
      }

      nav a {
        margin-left: 1rem;
        margin-bottom: 0.5rem;
      }
    }
  #calendar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1.5rem;
    padding: 2rem;
    max-width: 1300px;
    margin: auto;
  }

  .month {
    background-color: #1f1f1f;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 1rem;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    cursor: pointer;
  }

  .month:hover {
    transform: scale(1.02);
    box-shadow: 0 6px 20px rgba(249, 115, 22, 0.3);
  }

  .month h3 {
    margin-top: 0;
    color: #f97316;
    font-size: 1.1rem;
    margin-bottom: 0.5rem;
    text-align: center;
  }

  .entry {
    margin: 0.4rem 0;
    font-size: 0.8rem;
    color: #ddd;
  }

  .entry span.meta {
    display: block;
    font-size: 0.65rem;
    color: #aaa;
  }

  .anime {
    color: #f97316;
    font-weight: 600;
  }

  .manga {
    color: #34d399;
    font-weight: 600;
  }

  .manhwa {
    color: #60a5fa;
    font-weight: 600;
  }

  /* Responsive */
  @media (max-width: 1000px) {
    #calendar {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  @media (max-width: 768px) {
    #calendar {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 480px) {
    #calendar {
      grid-template-columns: 1fr;
      padding: 1rem;
    }
  }
  #calendar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 1.5rem;
  padding: 2rem;
}

.mini-month {
  background: #1f1f1f;
  border: 1px solid #444;
  border-radius: 10px;
  padding: 0.6rem;
  color: #fff;
  transition: transform 0.2s ease;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
}

.mini-month:hover {
  transform: scale(1.02);
  box-shadow: 0 0 14px rgba(249, 115, 22, 0.3);
}

.month-title {
  text-align: center;
  font-weight: bold;
  margin-bottom: 0.5rem;
  color: #f97316;
}

.mini-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  font-size: 0.75rem;
  text-align: center;
}

.weekday {
  font-weight: bold;
  color: #999;
}

.mini-day {
  background: #2a2a2a;
  border-radius: 6px;
  min-height: 35px;
  padding: 3px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.mini-day span {
  display: block;
}

.mini-day .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  display: inline-block;
  margin: 1px;
}

.dot.anime { background-color: #f97316; }
.dot.manga { background-color: #34d399; }
.dot.manhwa { background-color: #60a5fa; }

 .overlay {
  position: fixed;
  top: 5%;
  left: 50%;
  transform: translateX(-50%);
  width: 75vw; /* 75% of viewport width */
  height: 90vh; /* You can tweak this if needed */
  background: rgba(0, 0, 0, 0.95);
  z-index: 9999;
  display: none;
  flex-direction: row;
  align-items: flex-start;
  padding: 2rem;
  gap: 2rem;
  border-radius: 12px;
  box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
   max-width: 1200px;
}


.overlay.active {
  display: flex;
}

.overlay .close-btn {
  position: absolute;
  top: 1rem;
  right: 1rem;
  background: transparent;
  color: #fff;
  font-size: 1.1rem; /* Smaller size */
  border: none;
  cursor: pointer;
  padding: 0.2rem 0.4rem;
  line-height: 1;
  transition: transform 0.2s ease;
}

.overlay .close-btn:hover {
  transform: scale(1.2);
  color: #f97316; /* Optional hover color */
}

#calendarGrid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 0.5rem;
}

.day {
  background: #1f1f1f;
  border: 1px solid #333;
  border-radius: 8px;
  padding: 0.5rem;
  text-align: center;
  min-height: 60px;
  font-size: 0.9rem;
  cursor: pointer;
}

.day .dot {
  display: block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  margin: 2px auto 0;
}

.sidebar {
  width: 300px;
  max-height: 80vh;
  overflow-y: auto;
  background: #181818;
  padding: 1rem;
  border: 1px solid #333;
  border-radius: 10px;
}

.sidebar h2 {
  margin-top: 0;
  color: #f97316;
  text-align: center;
}

.sidebar .entry {
  margin-bottom: 1rem;
}
    /* Scrollbar for WebKit-based browsers (Chrome, Edge, Safari) */
.overlay::-webkit-scrollbar,
.sidebar::-webkit-scrollbar {
  width: 10px;
}

.overlay::-webkit-scrollbar-track,
.sidebar::-webkit-scrollbar-track {
  background: #000;
}

.overlay::-webkit-scrollbar-thumb,
.sidebar::-webkit-scrollbar-thumb {
  background-color: #f97316; /* Orange */
  border-radius: 6px;
  border: 2px solid #000;
}

/* Firefox scrollbar (limited support) */
.overlay,
.sidebar {
  scrollbar-color: #f97316 #000; /* thumb color, track color */
  scrollbar-width: thin;
}

.nav-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: #1f1f1f;
  color: #f97316;
  border: none;
  font-size: 1.5rem;
  padding: 0.5rem;
  border-radius: 50%;
  cursor: pointer;
  z-index: 10001;
  transition: background 0.2s ease, transform 0.2s ease;
}

.nav-btn:hover {
  background: #333;
  transform: translateY(-50%) scale(1.1);
}

.left-btn {
  left: 1rem;
}

.right-btn {
  right: 1rem;
}
    
  </style>
</head>
<body>

  <header>
    <h1><a href="index.html" style="color: #f97316; text-decoration: none;">AnimeHub</a></h1>
    <nav>
      <a href="index.html">Anime</a>
      <a href="browse.html">Browse</a>
      <a href="calendar.html">Schedule</a>
      <a href="/manga.html">Manga</a>
      <a href="/manhwa.html">Manhwa</a>
      <a href="favorites.html">❤️</a>
    </nav>
  </header>

  <div class="calendar-container" id="calendar">
    <p style="color:#bbb;">📅 Loading release calendar...</p>
  </div>

  <footer>
    Powered by Gemini API & Cloudflare Workers · Data auto-refreshes daily
  </footer>

  <script type="module" src="calendar.js"></script>
</body>
</html>
