<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Release Calendar| AnimeHub</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #121212;
      color: #fff;
      font-family: 'Poppins', sans-serif;
    }

      header {
      background-color: #1f1f1f;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 2rem;
      color: #f97316;
    }

    nav a {
      color: white;
      margin-left: 2rem;
      font-family: 'Poppins', sans-serif;
      text-decoration: none;
      font-weight: 600;
    }

    nav a[href="calendar.html"] {
      color: #f97316;
    }
    
    nav a:hover {
      color: #f97316;
    }
    
    .calendar-container {
      padding: 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }

    .month {
      background: #1f1f1f;
      border-radius: 8px;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      transition: all 0.3s ease;
      max-height: 180px;
      position: relative;
    }

    .month.expanded {
      max-height: 1000px;
    }

    .month h3 {
      margin: 0;
      font-size: 1rem;
      padding: 0.8rem;
      background: #262626;
      color: #f97316;
      cursor: pointer;
      border-bottom: 1px solid #333;
    }

    .month h3:hover {
      background: #333;
    }

    .month .entry {
      font-size: 0.85rem;
      padding: 0.4rem 0.8rem;
      border-bottom: 1px solid #222;
      line-height: 1.4;
    }

    .anime { color: #f97316; font-weight: bold; }
    .manga { color: #34d399; font-weight: bold; }
    .manhwa { color: #60a5fa; font-weight: bold; }

    .entry .meta {
      color: #aaa;
      font-size: 0.75rem;
    }

    footer {
      text-align: center;
      color: #888;
      padding: 1rem;
      font-size: 0.85rem;
    }

    @media (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }

      nav {
        margin-top: 0.5rem;
        flex-wrap: wrap;
      }

      nav a {
        margin-left: 1rem;
        margin-bottom: 0.5rem;
      }
    }
  #calendar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1.5rem;
    padding: 2rem;
    max-width: 1300px;
    margin: auto;
  }

  .month {
    background-color: #1f1f1f;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 1rem;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    cursor: pointer;
  }

  .month:hover {
    transform: scale(1.02);
    box-shadow: 0 6px 20px rgba(249, 115, 22, 0.3);
  }

  .month h3 {
    margin-top: 0;
    color: #f97316;
    font-size: 1.1rem;
    margin-bottom: 0.5rem;
    text-align: center;
  }

  .entry {
    margin: 0.4rem 0;
    font-size: 0.8rem;
    color: #ddd;
  }

  .entry span.meta {
    display: block;
    font-size: 0.65rem;
    color: #aaa;
  }

  .anime {
    color: #f97316;
    font-weight: 600;
  }

  .manga {
    color: #34d399;
    font-weight: 600;
  }

  .manhwa {
    color: #60a5fa;
    font-weight: 600;
  }

  /* Responsive */
  @media (max-width: 1000px) {
    #calendar {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  @media (max-width: 768px) {
    #calendar {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 480px) {
    #calendar {
      grid-template-columns: 1fr;
      padding: 1rem;
    }
  }
  #calendar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 1.5rem;
  padding: 2rem;
}

.mini-month {
  background: #1f1f1f;
  border: 1px solid #444;
  border-radius: 10px;
  padding: 0.6rem;
  color: #fff;
  transition: transform 0.2s ease;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
}

.mini-month:hover {
  transform: scale(1.02);
  box-shadow: 0 0 14px rgba(249, 115, 22, 0.3);
}

.month-title {
  text-align: center;
  font-weight: bold;
  margin-bottom: 0.5rem;
  color: #f97316;
}

.mini-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  font-size: 0.75rem;
  text-align: center;
}

.weekday {
  font-weight: bold;
  color: #999;
}

.mini-day {
  background: #2a2a2a;
  border-radius: 6px;
  min-height: 35px;
  padding: 3px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.mini-day span {
  display: block;
}

.mini-day .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  display: inline-block;
  margin: 1px;
}

.dot.anime { background-color: #f97316; }
.dot.manga { background-color: #34d399; }
.dot.manhwa { background-color: #60a5fa; }


  </style>
</head>
<body>

  <header>
    <h1>AnimeHub</h1>
    <nav>
      <a href="index.html">Anime</a>
      <a href="browse.html">Browse</a>
      <a href="calendar.html">Schedule</a>
      <a href="/manga.html">Manga</a>
      <a href="/manhwa.html">Manhwa</a>
      <a href="favorites.html">❤️</a>
    </nav>
  </header>

  <div class="calendar-container" id="calendar">
    <p style="color:#bbb;">📅 Loading release calendar...</p>
  </div>

  <footer>
    Powered by Gemini API & Cloudflare Workers · Data auto-refreshes daily
  </footer>

  <script type="module" src="calendar.js"></script>
</body>
</html>
