  width: 100%;
  height: 100%;

.profile-bubble.spinning {
  animation: spin360 0.6s linear;
  filter: blur(2px);

@keyframes spin360 {

  100% { transform: rotate(360deg); }

  <script>
  function logout() {
    // Remove user and profile
    localStorage.removeItem("user");
    localStorage.removeItem("profile");  // ✅ This was missing

    // Remove all favorite keys
    const keys = Object.keys(localStorage);
    keys.forEach(k => {
      if (
        k.startsWith("animeFavorites_") ||
        k.startsWith("mangaFavorites_") ||
        k.startsWith("manhwaFavorites_")
      ) {
        localStorage.removeItem(k);
      }
    });

    // Optional: clear any session state
    sessionStorage.setItem("toast", "👋 Logged out successfully");
    window.location.href = "index.html";
  }
</script>

 <script>
  const WORKER_URL = "https://anime-hub-auth.keshavkdas23.workers.dev/";

  async function loadUserProfile() {
    const avatarImg = document.querySelector(".profile-bubble img");
    const avatarBubble = document.querySelector(".profile-bubble");

    if (!user?.uid || !avatarImg || !avatarBubble) return;

    let profile = JSON.parse(localStorage.getItem("profile"));

    if (!profile || !profile.avatar) {
      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "getProfile",
            uid: user.uid
          })
        });

        const data = await res.json();
        if (data.success && data.profile) {
          profile = data.profile;
          localStorage.setItem("profile", JSON.stringify(profile));
        }
      } catch (err) {
        console.error("Error fetching profile from KV:", err);
      }
    }

    if (profile?.avatar) {
      avatarImg.src = profile.avatar;
      avatarImg.alt = `${profile.username}'s Avatar`;
    } else {
      avatarImg.src = "avatar.jpg";
      avatarImg.alt = "Default Avatar";
    }

    // Enable dropdown only for logged-in users
    avatarBubble.onclick = () => {
      toggleDropdown();
    };
  }

  window.addEventListener("DOMContentLoaded", loadUserProfile);
</script>

 <script>
  function toggleDropdown() {
  if (!user) return; // ❌ Do nothing if user is not logged in
    
  const dropdown = document.getElementById("profileDropdown");
  const avatar = document.querySelector(".profile-bubble");

  avatar.classList.add("spinning");
  setTimeout(() => avatar.classList.remove("spinning"), 600);

  dropdown.classList.toggle("show");
}

document.addEventListener("click", function (e) {
  const avatar = document.querySelector(".profile-bubble");
  const dropdown = document.getElementById("profileDropdown");
  if (!avatar.contains(e.target) && !dropdown.contains(e.target)) {
    dropdown.classList.remove("show");
  }
});

</script>

  
<script>
  let currentPage = 1;
  let isLoading = false;
  const loadedAnimeIds = new Set();
  let toastTimeout;

  function isInFavorites(id) {
    if (!user) return false;
    const key = `animeFavorites_${user.uid}`;
    const favs = JSON.parse(localStorage.getItem(key)) || [];
    return favs.some(fav => String(fav.id) === String(id));
  }
  function shuffleArrayWithSeed(array, seed) {
  const seededRandom = (s) => {
    let x = Math.sin(s++) * 10000;
    return x - Math.floor(x);
  };

  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(seededRandom(seed + i) * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }

  return array;
}


  async function loadTrendingAnime() {
    const container = document.getElementById("animeContainer");
    if (isLoading) return;
    isLoading = true;

    try {
      const res = await fetch(`https://api.jikan.moe/v4/top/anime?page=${currentPage}`);
      const data = await res.json();

      const todaySeed = Date.now(); // Unique every time page loads
      const shuffledAnime = shuffleArrayWithSeed(data.data, todaySeed);

      shuffledAnime.forEach(anime => {
        if (loadedAnimeIds.has(anime.mal_id)) return;
        loadedAnimeIds.add(anime.mal_id);

        const id = anime.mal_id;
        const title = anime.title.replace(/'/g, "\\'");
        const imageUrl = anime.images.jpg.large_image_url.replace(/"/g, '&quot;'); 

        const card = document.createElement('div');
        card.classList.add('anime-card');

        const isFav = isInFavorites(id);
        const heartIcon = isFav ? '💖' : '❤️';
        
        card.innerHTML = `
          <div class="anime-card-inner">
            <a href="anime.html?id=${id}">
              <img src="${imageUrl}" alt="${title}" loading="lazy" onerror="this.src='fallback.jpg';">
            </a>
            <div class="favorite-bubble fav-btn ${isFav ? 'active' : ''}" data-id="${id}" onclick="event.stopPropagation(); addToFavorites('${id}', '${title}', '${imageUrl}')">${heartIcon}</div>
            <h3>${title}</h3>
          </div>
        `;
        container.appendChild(card);
        markFavoritesActive();
      });

      currentPage++;
    } catch (err) {
      console.error("Failed to load anime:", err);
    } finally {
      isLoading = false;
    }
  }

  function addToFavorites(id, title, imageUrl) {
  try {
    if (!user) {
      showToast('🔐 This action requires login');
      setTimeout(() => window.location.href = "index.html", 1500);
      return;
    }

    const key = `animeFavorites_${user.uid}`;
    const favs = JSON.parse(localStorage.getItem(key)) || [];
    const index = favs.findIndex(fav => String(fav.id) === String(id));
    const heartButtons = document.querySelectorAll(`.favorite-bubble[data-id="${id}"]`);

    if (index > -1) {
      // Remove
      favs.splice(index, 1);
      showToast('Removed from favorites!');
      heartButtons.forEach(btn => {
        btn.textContent = '❤️';
        btn.classList.remove('active');
      });
    } else {
      // Add
      favs.push({
        id: String(id),
        title: title.trim(),
        imageUrl: imageUrl.trim(),
        type: 'anime'
      });
      showToast('Added to favorites!');
      heartButtons.forEach(btn => {
        btn.textContent = '💖';
        btn.classList.add('active');
      });
    }

    localStorage.setItem(key, JSON.stringify(favs));
    markFavoritesActive();
  } catch (err) {
    console.error('Error toggling favorite:', err);
    showToast('Something went wrong!');
  }
}


  function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.style.visibility = 'visible';
    toast.style.opacity = '1';

    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.visibility = 'hidden';
    }, 2500);
  }

  let scrollDebounce;

 function markFavoritesActive() {
  if (!user) return;

  const key = `animeFavorites_${user.uid}`;
  const favorites = JSON.parse(localStorage.getItem(key)) || [];

  document.querySelectorAll('.anime-card .favorite-bubble').forEach(btn => {
    const card = btn.closest('.anime-card');
    const id = card.querySelector('a')?.href.match(/id=(\d+)/)?.[1];

    if (favorites.some(fav => fav.id == id)) {

    <p style="margin:1rem 0; font-size:0.9rem;"><strong>Episodes:</strong> ${anime.episodes ?? '—'}</p>
     <a href="anime.html?id=${anime.mal_id}" style="
      background:#f97316;
  color:#fff;
  padding:1rem 2rem;
  font-size:1.2rem;
  font-weight: bold;
  border-radius:8px;
  cursor:pointer;
  max-width: 200px;
  text-decoration: none;
  display: inline-block;
  text-align: center;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  transition: transform 0.2s ease;
  a:hover {
  transform: scale(1.05);
  }
    ">
      🐠 Dive In
    </a>
  </div>
`;


      track.appendChild(slide);
    });

    let idx = 0, total = track.children.length;
    function slideTo(i) {
      track.style.transition = 'transform 0.5s ease-in-out';
      track.style.transform = `translateX(-${i * 100}vw)`;
    }

    let interval = setInterval(() => {
      idx = (idx + 1) % total;
      slideTo(idx);
    }, 4000);

    [prevBtn, nextBtn].forEach(btn => {
      btn.addEventListener('click', () => {
        idx = btn === nextBtn ? (idx + 1) % total : (idx - 1 + total) % total;
        slideTo(idx);
        clearInterval(interval);
        interval = setInterval(() => {
          idx = (idx + 1) % total;
          slideTo(idx);
        }, 4000);
      });
    });
  } catch (e) {
    console.error('Carousel error:', e);
  }
})();

</script>

<script>
  document.addEventListener("DOMContentLoaded", () => {

    // Change Login button to "Start Browsing"
    const browseBtn = document.getElementById("browse-btn");
    if (user && browseBtn) {
      browseBtn.innerText = "Start Browsing";
      browseBtn.href = "browse.html";
    }

    // Set profile avatar bubble
    const bubble = document.getElementById("profile-bubble");
    if (bubble) {
      bubble.src = profile?.avatar || "avatar.jpg";
    }

    // Disable favorite icons if not logged in
    document.querySelectorAll(".fav-icon").forEach(icon => {
      icon.onclick = (e) => {
        if (!user) {
          e.preventDefault();
          showToast("🔐 This action requires login");
          setTimeout(() => window.location.href = "index.html", 1500);
        }
      };
    });
  });

  // Toast function
  function showToast(msg) {
    const toast = document.createElement("div");
    toast.textContent = msg;
    toast.style.position = "fixed";
    toast.style.bottom = "20px";
    toast.style.left = "50%";
    toast.style.transform = "translateX(-50%)";
    toast.style.background = "#f97316";
    toast.style.color = "#fff";
    toast.style.padding = "10px 20px";
    toast.style.borderRadius = "5px";
    toast.style.zIndex = "9999";
    toast.style.fontWeight = "bold";
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 1800);
  }
</script>
<script>
  // Show toast message passed via sessionStorage
  window.addEventListener("DOMContentLoaded", () => {
    const toastMsg = sessionStorage.getItem("toast");
    if (toastMsg) {
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = toastMsg;
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.remove();
      }, 3000);

      sessionStorage.removeItem("toast");
    }
  });
</script>
