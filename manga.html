<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manga | AnimeHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=Poppins:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    header {
      background-color: #1f1f1f;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    header h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 2rem;
      color: #f97316;
      margin: 0;
      font-weight: 600;
      letter-spacing: -1px;
    }

    nav {
      display: flex;
      align-items: center;
    }

    nav a {
      color: white;
      margin-left: 2rem;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: #f97316;
    }

    h2 {
      font-family: 'Poppins', sans-serif;
      color: #f97316;
      text-align: center;
      margin: 1rem 0;
      font-size: 1.8rem;
    }

    .carousel-wrapper {
      position: relative;
      background-color: #1a1a1a;
      overflow: hidden;
      height: 400px;
      margin-bottom: 1rem;
    }

    .carousel-track {
      display: flex;
      transition: transform 0.8s ease-in-out;
      height: 100%;
    }

    .carousel-item {
      min-width: 100%;
      display: flex;
      flex-direction: row-reverse;
      align-items: center;
      justify-content: space-between;
      padding: 2rem;
      box-sizing: border-box;
      background: linear-gradient(to left, #000000 30%, rgba(0, 0, 0, 0.7));
    }

    .carousel-item img {
      width: 250px;
      height: 360px;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(255,255,255,0.1);
      flex-shrink: 0;
    }

    .carousel-info {
      margin-left: 2rem;
      color: white;
      max-width: 50%;
    }

    .carousel-info h2 {
      font-size: 2.4rem;
      color: #f97316;
      margin-bottom: 0.7rem;
      font-family: 'Oswald', sans-serif;
      text-align: left;
    }

    .carousel-info p {
      margin: 0.3rem 0;
      font-family: 'Poppins', sans-serif;
    }

    .dive-button {
      margin-top: 1rem;
      background-color: #f97316;
      color: white;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .dive-button:hover {
      background-color: #fb923c;
    }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background-color: rgba(0, 0, 0, 0.5);
      color: #f97316;
      border: none;
      font-size: 2rem;
      padding: 0.5rem 1rem;
      cursor: pointer;
      z-index: 5;
      transition: background-color 0.3s ease;
      border-radius: 4px;
    }

    .carousel-btn:hover {
      background-color: rgba(249, 115, 22, 0.8);
      color: #fff;
    }

    .carousel-btn.prev {
      left: 10px;
    }

    .carousel-btn.next {
      right: 10px;
    }

    .explore-section {
      padding: 2rem 1rem;
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.5rem;
    }

    .anime-card {
      background-color: #1f1f1f;
      border-radius: 10px;
      overflow: hidden;
      transition: transform 0.3s;
    }

    .anime-card:hover {
      transform: scale(1.05);
    }

    .card-img-wrapper {
      position: relative;
      cursor: pointer;
    }

    .card-img-wrapper img {
      width: 100%;
      height: 260px;
      object-fit: cover;
    }

    .anime-info {
      padding: 1rem;
      font-family: 'Poppins', sans-serif;
    }

    .anime-info h3 {
      color: #f97316;
      font-size: 1.1rem;
      margin: 0 0 0.5rem;
    }

    .anime-info p {
      margin: 0.2rem 0;
      font-size: 0.9rem;
      color: #ccc;
    }
    .fav-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: rgba(0, 0, 0, 0.7);
      border: none;
      color: #f97316;
      font-size: 1.2rem;
      border-radius: 50%;
      padding: 6px 10px;
      cursor: pointer;
      z-index: 1;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .fav-btn:hover {
      background-color: #f97316;
      color: white;
      transform: scale(1.1);
    }

  </style>
</head>
<body>

  <header>
    <h1>AnimeHub</h1>
    <nav>
      <a href="index.html">Anime</a>
      <a href="browse.html">Browse</a>
      <a href="/manga.html" class="hover:text-purple-400">Manga</a>
      <a href="/manhwa.html" class="hover:text-purple-400">Manhwa</a>
      <a href="favorites.html" style="color:#f97316; font-weight:bold;">❤️</a>
    </nav>
  </header>

  <!-- Auto Carousel Section -->
  <section class="carousel-wrapper">
    <button class="carousel-btn prev" aria-label="Previous">&#10094;</button>
    <div class="carousel-track" id="carouselTrack"></div>
    <button class="carousel-btn next" aria-label="Next">&#10095;</button>
  </section>

  <!-- Explore Section -->
  <section class="explore-section">
    <h2>✨Explore More Manga</h2>
    <div id="mangaResults" class="results-grid"></div>
  </section>

<script>
  const track = document.getElementById("carouselTrack");
  const mangaResults = document.getElementById("mangaResults");
  const nextBtn = document.querySelector(".carousel-btn.next");
  const prevBtn = document.querySelector(".carousel-btn.prev");

  let index = 0;
  let currentPage = 1;
  let hasMore = true;
  let mangaList = [];

  async function loadAutoCarousel() {
    try {
      const res = await fetch(`https://api.jikan.moe/v4/manga?order_by=popularity&limit=10&type=manga`);
      const json = await res.json();
      mangaList = json.data.filter(manga => manga.type?.toLowerCase() !== "manhwa");

      mangaList.forEach(manga => {
        const slide = document.createElement('div');
        slide.className = 'carousel-item';

        slide.innerHTML = `
          <img src="${manga.images.jpg.large_image_url}" alt="${manga.title}" />
          <div class="carousel-info">
            <h2>${manga.title}</h2>
            <p><strong>Score:</strong> ${manga.score ?? "N/A"}</p>
            <p><strong>Type:</strong> ${manga.type}</p>
            <p><strong>Chapters:</strong> ${manga.chapters ?? "Unknown"}</p>
            <p><strong>Synopsis:</strong> ${manga.synopsis ? manga.synopsis.slice(0, 220) + "..." : "No description available."}</p>
            <button class="dive-button" onclick="location.href='manga-details.html?id=${manga.mal_id}'">🐠 Dive In</button>
          </div>
        `;
        track.appendChild(slide);
      });

      setInterval(() => {
        index = (index + 1) % mangaList.length;
        track.style.transform = `translateX(-${index * 100}%)`;
      }, 5000);

      nextBtn.addEventListener("click", () => {
        index = (index + 1) % mangaList.length;
        track.style.transform = `translateX(-${index * 100}%)`;
      });

      prevBtn.addEventListener("click", () => {
        index = (index - 1 + mangaList.length) % mangaList.length;
        track.style.transform = `translateX(-${index * 100}%)`;
      });

    } catch (err) {
      console.error("Carousel error:", err);
    }
  }

  async function loadMoreManga() {
    if (!hasMore) return;
    try {
      const res = await fetch(`https://api.jikan.moe/v4/manga?page=${currentPage}&limit=12`);
      const json = await res.json();
      const favorites = JSON.parse(localStorage.getItem("mangaFavorites")) || [];

      json.data.forEach(manga => {
        if (manga.type?.toLowerCase() === "manhwa") return;
        const card = document.createElement("div");
        card.className = "anime-card";

        const title = manga.title;
        const imageUrl = manga.images?.jpg?.image_url || "";
        const score = manga.score ?? "N/A";
        const type = manga.type ?? "Unknown";
        const chapters = manga.chapters;

        const isFavorited = favorites.some(fav => fav.id === String(manga.mal_id));

        const infoHTML = `
          <h3>${title}</h3>
          <p><strong>Score:</strong> ${score}</p>
          <p><strong>Type:</strong> ${type}</p>
          ${chapters ? `<p><strong>Chapters:</strong> ${chapters}</p>` : ""}
        `;

        card.innerHTML = `
          <div class="card-img-wrapper">
            <img src="${imageUrl}" alt="${title}" />
            <button class="fav-btn ${isFavorited ? 'active' : ''}" data-id="${manga.mal_id}" title="Add to favorites">${isFavorited ? '💖' : '❤️'}</button>
          </div>
          <div class="anime-info">${infoHTML}</div>
        `;

        card.querySelector(".card-img-wrapper").addEventListener("click", (e) => {
          if (!e.target.classList.contains("fav-btn")) {
            window.location.href = `manga-details.html?id=${manga.mal_id}`;
          }
        });

        mangaResults.appendChild(card);
      });

      currentPage++;
      hasMore = json.pagination?.has_next_page;
    } catch (err) {
      console.error("Failed to load manga:", err);
    }
  }

  document.addEventListener("click", (e) => {
    if (e.target.classList.contains("fav-btn")) {
      const id = e.target.dataset.id;
      let favorites = JSON.parse(localStorage.getItem("mangaFavorites")) || [];

      const existingIndex = favorites.findIndex(fav => fav.id === id);

      if (existingIndex > -1) {
        favorites.splice(existingIndex, 1);
        e.target.innerText = "❤️";
        e.target.classList.remove("active");
      } else {
        const card = e.target.closest(".anime-card");
        const title = card.querySelector("h3").innerText;
        const imageUrl = card.querySelector("img").src;

        favorites.push({
          id,
          title,
          imageUrl,
          type: "manga"
        });

        e.target.innerText = "💖";
        e.target.classList.add("active");
      }

      localStorage.setItem("mangaFavorites", JSON.stringify(favorites));
    }
  });

  window.addEventListener("DOMContentLoaded", () => {
    loadAutoCarousel();
    loadMoreManga();
  });

  window.addEventListener("scroll", () => {
    const { scrollTop, scrollHeight, clientHeight } = document.documentElement;
    if (scrollTop + clientHeight >= scrollHeight - 100) {
      loadMoreManga();
    }
  });
</script>


</body>
</html>
