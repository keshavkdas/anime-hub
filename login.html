<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AnimeHub Auth</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    body {
      background: #0e0e0e;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: #1b1b1b;
      padding: 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
    }

    input {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 10px;
      border: none;
      border-radius: 5px;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      background-color: #ff6600;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: #e65c00;
    }

    .switch-link {
      margin-top: 10px;
      text-align: center;
    }

    .switch-link a {
      color: #ffa500;
      cursor: pointer;
      text-decoration: underline;
    }

    .hidden {
      display: none;
    }

    #google-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    #google-form {
      background: #222;
      padding: 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
    }

    #google-form h3 {
      margin-top: 0;
    }
  </style>
</head>
<body>

<div class="container">
  <div id="login-box">
    <h2>Login</h2>
    <input type="email" id="login-email" placeholder="Email" />
    <input type="password" id="login-password" placeholder="Password" />
    <button onclick="login()">Login</button>
    <button onclick="googleLogin()">Login with Google</button>
    <div class="switch-link">Don't have an account? <a onclick="toggleForm()">Sign Up</a></div>
  </div>

  <div id="signup-box" class="hidden">
    <h2>Sign Up</h2>
    <input type="email" id="signup-email" placeholder="Email" />
    <input type="password" id="signup-password" placeholder="Password" />
    <input type="password" id="signup-confirm" placeholder="Confirm Password" />
    <button onclick="signup()">Sign Up</button>
    <div class="switch-link">Already have an account? <a onclick="toggleForm()">Login</a></div>
  </div>
</div>

<!-- Overlay for Google Sign-Up -->
<div id="google-overlay" style="display: none; position: fixed; top: 0; left: 0; 
  width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); 
  z-index: 9999; justify-content: center; align-items: center; color: white;">

  <div style="background: #222; padding: 20px; border-radius: 10px; max-width: 400px; width: 90%;">
    <h3>Complete Sign-Up</h3>
    <label>Email (Google)</label>
    <input id="google-email" type="email" readonly style="width:100%; padding:10px; margin: 5px 0;" />

    <label>Username</label>
    <input id="google-username" placeholder="Choose a username" style="width:100%; padding:10px; margin: 5px 0;" />

    <label>Password</label>
    <input id="google-password" type="password" placeholder="Set a password" style="width:100%; padding:10px; margin: 5px 0;" />
    
    <input id="google-confirm" type="password" placeholder="Confirm password" style="width:100%; padding:10px; margin: 5px 0;" />
    
    <button onclick="submitGoogleSignup()" style="width:100%; margin-top: 10px;">Submit & Verify Email</button>
    <button onclick="closeGoogleOverlay()" style="width:100%; margin-top: 5px; background: #555;">Cancel</button>
  </div>
</div>
<div id="login-box">
  <h2>Login</h2>
  <input type="email" id="login-email" placeholder="Email"><br>
  <input type="password" id="login-password" placeholder="Password"><br>
  <button onclick="login()">Login</button><br>
  <button onclick="googleLogin()">Login with Google</button>
</div>

<!-- Signup Box (hidden by default) -->
<div id="signup-box" style="display: none;">
  <h2>Register</h2>
  <input type="email" id="signup-email" placeholder="Email"><br>
  <input type="text" id="signup-username" placeholder="Username"><br>
  <input type="password" id="signup-password" placeholder="Password"><br>
  <input type="password" id="signup-confirm" placeholder="Confirm Password"><br>
  <button onclick="signup()">Submit & Verify Email</button>
</div>

<!-- Verify Email Overlay -->
<div id="verify-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#111e; color:white; z-index:9999; justify-content:center; align-items:center; font-size:1.2em;">
  <div style="text-align:center;">
    <p>📧 Check your email and click the verification link.</p>
    <p>This page will log you in automatically once verified.</p>
  </div>
</div>

<script type="module" src="auth.js"></script>
</body>
</html>
