<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AnimeHub Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #1c1c1c, #2a2a2a);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .auth-container {
      background: #111;
      padding: 30px;
      border-radius: 10px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 0 20px #000;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      font-size: 14px;
      border: none;
      border-radius: 5px;
    }
    button {
      background: #ff6600;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #e65c00;
    }
    .toggle {
      text-align: center;
      margin-top: 10px;
      color: #aaa;
    }
    .toggle a {
      color: #ffa500;
      cursor: pointer;
    }
    .hidden {
      display: none;
    }
    #verify-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      color: white;
      font-size: 18px;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      text-align: center;
      flex-direction: column;
    }
  </style>
</head>
<body>
  <noscript>
    <div style="color: red; text-align: center;">This app requires JavaScript to function.</div>
  </noscript>

  <div class="auth-container">
    <!-- Login Box -->
    <div id="login-box">
      <h2>Login</h2>
      <input id="login-email" type="email" placeholder="Email" required />
      <input id="login-password" type="password" placeholder="Password" required />
      <button onclick="login()">Login</button>
      <button onclick="googleLogin()">Login with Google</button>
      <button onclick="resetPassword()">Forgot Password?</button>
      <div class="toggle">
        Don't have an account? <a onclick="toggleForm()">Sign Up</a>
      </div>
    </div>

    <!-- Signup Box -->
    <div id="signup-box" class="hidden">
      <h2>Sign Up</h2>
      <input id="signup-email" type="email" placeholder="Email" required />
      <input id="signup-username" type="text" placeholder="Username" required />
      <input id="signup-password" type="password" placeholder="Password" required />
      <input id="signup-confirm" type="password" placeholder="Confirm Password" required />
      <button onclick="signup()">Create Account</button>
      <div class="toggle">
        Already have an account? <a onclick="toggleForm()">Login</a>
      </div>
    </div>
  </div>

  <!-- Email Verification Overlay -->
  <div id="verify-overlay">
    📧 A verification link has been sent to your email.<br /><br />
    Please verify to continue. This page will reload automatically once verified.
  </div>

  <script type="module" src="auth.js"></script>
</body>
</html>
