<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AnimeHub Auth</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" />
  <style>
    body {
      margin: 0;
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .auth-container {
      background: #1c1c1c;
      padding: 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
    }

    .auth-container h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      background: #2a2a2a;
      color: #fff;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #ff6600;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #e05500;
    }

    .toggle-link {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .toggle-link span {
      color: #ffa500;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }

    .error {
      color: #ff4e4e;
      font-size: 12px;
      margin-top: -5px;
    }

    #verify-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.9);
      color: white;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    #verify-overlay div {
      background: #222;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
    }

    #verify-overlay p {
      margin: 10px 0;
      font-size: 18px;
    }

    .captcha-box {
      background: #2a2a2a;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      margin-top: 10px;
      user-select: none;
    }
  </style>
</head>
<body>

<div class="auth-container">
  <div id="login-box">
    <h2>Login</h2>
    <input type="email" id="login-email" placeholder="Email" />
    <div class="error" id="login-email-error"></div>
    <input type="password" id="login-password" placeholder="Password" />
    <div class="error" id="login-password-error"></div>
    <button onclick="login()">Login</button>
    <button onclick="googleLogin()">Login with Google</button>
    <div class="toggle-link">Don't have an account? <span onclick="toggleForm()">Sign Up</span></div>
  </div>

  <div id="signup-box" class="hidden">
    <h2>Sign Up</h2>
    <input type="email" id="signup-email" placeholder="Email" />
    <input type="text" id="signup-username" placeholder="Username" />
    <div class="error" id="username-error"></div>
    <input type="password" id="signup-password" placeholder="Password" />
    <input type="password" id="signup-confirm" placeholder="Confirm Password" />
    <div class="captcha-box" id="captcha-box"></div>
    <input type="text" id="captcha-answer" placeholder="Enter Captcha" />
    <button onclick="signup()">Submit</button>
    <div class="toggle-link">Already have an account? <span onclick="toggleForm()">Login</span></div>
  </div>
</div>

<div id="verify-overlay">
  <div>
    <p>📧 A verification link has been sent to your email.</p>
    <p>Please check your inbox and verify to continue.</p>
  </div>
</div>

<script type="module" src="auth.js"></script>
</body>
</html>
