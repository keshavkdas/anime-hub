<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AnimeHub Auth</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f0f0f, #1f1f1f);
      color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .auth-container {
      background: #161b22;
      padding: 40px;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
      position: relative;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-weight: 600;
      color: #ffffff;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      font-size: 15px;
      color: #c9d1d9;
    }

    input:focus {
      border-color: #58a6ff;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      font-size: 15px;
      font-weight: 600;
      background: #238636;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #2ea043;
    }

    .toggle {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
      color: #8b949e;
    }

    .toggle a {
      color: #58a6ff;
      cursor: pointer;
      text-decoration: none;
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      transition: opacity 0.4s ease;
    }

    .visible {
      opacity: 1;
      pointer-events: all;
      position: relative;
      transition: opacity 0.4s ease;
    }

    #gsi-button {
      width: 100%;
      margin: 10px 0;
    }

    #gsi-button > div {
      width: 100% !important;
      border-radius: 6px !important;
      overflow: hidden;
    }

    #verify-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }

    #verify-modal {
      background: #161b22;
      border: 1px solid #30363d;
      padding: 30px;
      border-radius: 10px;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    @media (max-width: 500px) {
      .auth-container {
        padding: 24px;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <!-- Login -->
    <div id="login-box" class="visible">
      <h2>Welcome Back</h2>
      <input id="login-email" type="email" placeholder="Email" required />
      <input id="login-password" type="password" placeholder="Password" required />
      <button onclick="login()">Login</button>
      <div id="gsi-button"></div>
      <div class="toggle">
        New here? <a onclick="toggleForm()">Sign up</a>
      </div>
    </div>

    <!-- Signup -->
    <div id="signup-box" class="hidden">
      <h2>Create Your Account</h2>
      <input id="signup-email" type="email" placeholder="Email" required readonly />
      <input id="signup-username" type="text" placeholder="Username" required />
      <input id="signup-password" type="password" placeholder="Password" required />
      <input id="signup-confirm" type="password" placeholder="Confirm Password" required />
      <button onclick="signup()">Create Account</button>
      <div class="toggle">
        Already have an account? <a onclick="toggleForm()">Login</a>
      </div>
    </div>
  </div>

  <!-- Email Verification Modal -->
  <div id="verify-overlay">
    <div id="verify-modal">
      📧 <strong>Verification email sent</strong><br /><br />
      Please check your inbox to verify your email.<br /><br />
      This page will refresh automatically once verified.
    </div>
  </div>

  <script type="module" src="auth.js"></script>
</body>
</html>
