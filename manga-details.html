<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manga Details</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=Poppins:wght@500&display=swap" rel="stylesheet" />
  <style>
    /* Your CSS remains unchanged, keeping styles for .similar-section, .character-list, .anime-detail-header etc. */
    body {
      margin: 0;
      background: #121212;
      font-family: 'Poppins', sans-serif;
      color: white;
    }
    .similar-section {
      padding: 2rem 0;
    }
    .similar-section h3 {
      color: #f97316;
      margin-bottom: 1rem;
      font-family: 'Oswald', sans-serif;
    }
    .related-list#similarList {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1rem;
    }
    .related-list#similarList a {
      background: #1f1f1f;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease;
      text-decoration: none;
      color: white;
      box-shadow: 0 0 5px rgba(249, 115, 22, 0.1);
    }
    .related-list#similarList a:hover {
      transform: scale(1.05);
      box-shadow: 0 0 8px rgba(249, 115, 22, 0.3);
    }
    .related-list#similarList img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-bottom: 2px solid #f97316;
    }
    .related-list#similarList div {
      padding: 0.5rem;
      text-align: center;
      font-size: 0.9rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
<header>
  <h1><a href="index.html" style="color: #f97316; text-decoration: none;">AnimeHub</a></h1>
  <nav>
    <a href="index.html">Anime</a>
    <a href="browse.html">Browse</a>
    <a href="calendar.html">Schedule</a>
    <a href="manga.html">Manga</a>
    <a href="manhwa.html">Manhwa</a>
    <a href="favorites.html" style="color:#f97316; font-weight:bold;">❤️</a>
  </nav>
</header>

<div class="container">
  <div id="mangaDetails"></div>
  <div class="section" id="characterSection">
    <h3>Characters</h3>
    <div class="character-list" id="characterList"></div>
  </div>

  <div class="section" id="chapterSection">
    <h3>Chapters</h3>
    <div class="chapter-list" id="chapterList"></div>
  </div>

  <div class="section similar-section" id="similarSection" style="display:none;">
    <h3>Similar Titles</h3>
    <div class="related-list" id="similarList"></div>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const mangaId = params.get('id');

let favKey = 'mangaFavorites';
let contentType = 'manga';

function isManhwa(genres, type) {
  return genres.some(g => g.name.toLowerCase() === 'manhwa') || (type && type.toLowerCase() === 'manhwa');
}

function isInFavorites(id) {
  const arr = JSON.parse(localStorage.getItem(favKey)) || [];
  return arr.some(item => String(item.id) === String(id));
}

function toggleFavorite(id, title, img) {
  const arr = JSON.parse(localStorage.getItem(favKey)) || [];
  const idx = arr.findIndex(i => String(i.id) === String(id));
  const btn = document.querySelector(`.favorite-bubble[data-id="${id}"]`);
  if (idx > -1) {
    arr.splice(idx, 1);
    btn.classList.remove('active');
  } else {
    arr.push({ id: String(id), title, imageUrl: img, type: contentType });
    btn.classList.add('active');
  }
  btn.textContent = btn.classList.contains('active') ? '💖' : '❤️';
  localStorage.setItem(favKey, JSON.stringify(arr));
}

function markFav(id) {
  const btn = document.querySelector(`.favorite-bubble[data-id="${id}"]`);
  if (!btn) return;
  const act = isInFavorites(id);
  btn.classList.toggle('active', act);
  btn.textContent = act ? '💖' : '❤️';
}

async function fetchSimilar(genres, malId) {
  if (!genres || !genres.length) {
    console.warn('No genres available.');
    return;
  }

  const genreIds = genres.map(g => g.mal_id).filter(Boolean);
  if (!genreIds.length) {
    console.warn('No valid genre IDs found.');
    return;
  }

  console.log('Fetching similar using genres:', genreIds);

  const similarSet = new Set();
  const currentId = String(malId);
  let page = 1;
  const maxPages = 3;
  const results = [];

  while (results.length < 12 && page <= maxPages) {
    try {
      const res = await fetch(`https://api.jikan.moe/v4/manga?genres=${genreIds.join(',')}&order_by=popularity&sort=desc&page=${page}`);
      const json = await res.json();

      if (!json || !Array.isArray(json.data)) {
        console.warn('Invalid or missing data in similar response:', json);
        break;
      }

      for (const item of json.data) {
        const idStr = String(item.mal_id);
        if (!similarSet.has(idStr) && idStr !== currentId) {
          similarSet.add(idStr);
          results.push(item);
        }
      }
      page++;
    } catch (err) {
      console.error('Error fetching similar manga:', err);
      break;
    }
  }

  if (results.length) {
    const container = document.getElementById("similarSection");
    const list = document.getElementById("similarList");

    list.innerHTML = results.map(m => `
      <a href="manga-details.html?id=${m.mal_id}" class="related">
        <img src="${m.images.jpg.image_url}" alt="${m.title}">
        <div>${m.title}</div>
      </a>`).join('');

    container.style.display = 'block';
  }
}

async function fetchMangaDetails() {
  document.getElementById('mangaDetails').innerHTML = '<p>Loading...</p>';
  try {
    const res = await fetch(`https://api.jikan.moe/v4/manga/${mangaId}/full`);
    const { data } = await res.json();
    const img = data.images.jpg.large_image_url;

    if (isManhwa(data.genres, data.type)) {
      favKey = 'manhwaFavorites';
      contentType = 'manhwa';
    }

    document.getElementById('mangaDetails').innerHTML = `
      <div class="anime-detail-header">
        <div class="anime-image-container">
          <img src="${img}" alt="">
          <div class="favorite-bubble" data-id="${data.mal_id}">❤️</div>
        </div>
        <div class="anime-info">
          <h1>${data.title}</h1>
          <p><strong>Synopsis:</strong> <span id="synopsis-text">${(data.synopsis || 'No synopsis.').slice(0, 300)}</span><span id="dots">...</span><span id="more-text" style="display:none;">${(data.synopsis || '').slice(300)}</span>
          <button id="read-more-btn" style="background:none; border:none; color:#f97316; cursor:pointer; font-weight:bold;">Read more</button></p>
          <p><strong>Type:</strong> ${data.type}</p>
          <p><strong>Status:</strong> ${data.status}</p>
          <p><strong>Chapters:</strong> ${data.chapters || 'Unknown'}</p>
          <p><strong>Score:</strong> ${data.score || 'N/A'}</p>
          <p><strong>Published:</strong> ${data.published.string}</p>
        </div>
      </div>`;

    const btn = document.querySelector(`.favorite-bubble[data-id="${data.mal_id}"]`);
    btn.addEventListener('click', () => toggleFavorite(data.mal_id, data.title, img));
    markFav(data.mal_id);

    document.getElementById('read-more-btn').addEventListener('click', () => {
      const dots = document.getElementById('dots');
      const moreText = document.getElementById('more-text');
      const btn = document.getElementById('read-more-btn');
      if (dots.style.display === 'none') {
        dots.style.display = 'inline';
        moreText.style.display = 'none';
        btn.textContent = 'Read more';
      } else {
        dots.style.display = 'none';
        moreText.style.display = 'inline';
        btn.textContent = 'Read less';
      }
    });

    console.log("Genres for this manga:", data.genres);
    fetchSimilar(data.genres, data.mal_id);

  } catch (e) {
    console.error(e);
    document.getElementById('mangaDetails').innerHTML = '<p>Error loading details.</p>';
  }
}

async function fetchCharacters() {
  const res = await fetch(`https://api.jikan.moe/v4/manga/${mangaId}/characters`);
  const { data } = await res.json();
  if (!data || data.length === 0) {
    document.getElementById('characterSection').remove();
    return;
  }
  const html = data.map(c => `
    <a href="character.html?id=${c.character.mal_id}" class="character-bubble">
      <div class="img-wrapper">
        <img src="${c.character.images.jpg.image_url}" alt="">
      </div>
      <div class="character-name">${c.character.name}</div>
    </a>`).join('');
  document.getElementById('characterList').innerHTML = html;
}

async function fetchChapters() {
  const res = await fetch(`https://api.jikan.moe/v4/manga/${mangaId}/chapters`);
  const { data } = await res.json();
  if (!data || data.length === 0) {
    document.getElementById('chapterSection').remove();
    return;
  }
  const html = data.slice(0, 20).map(c => `
    <div class="chapter">
      <strong>Chapter ${c.mal_id}</strong>
      <p>${c.title || 'Untitled'}</p>
    </div>`).join('');
  document.getElementById('chapterList').innerHTML = html;
}

fetchMangaDetails();
fetchCharacters();
fetchChapters();
</script>
</body>
</html>
