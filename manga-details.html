<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manga Details</title>
  <link rel="stylesheet" href="style.css" id="header-style" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=Poppins:wght@500&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      background: #121212;
      font-family: 'Poppins', sans-serif;
      color: white;
    }
    header {
      background-color: #1f1f1f;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 2rem;
      color: #f97316;
    }
    nav a {
      color: white;
      margin-left: 2rem;
      font-family: 'Poppins', sans-serif;
      text-decoration: none;
      font-weight: 600;
    }
    nav a:hover {
      color: #f97316;
    }
    .container {
      padding: 2rem;
    }
    .anime-detail-header {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      align-items: flex-start;
    }
    .anime-image-container {
      flex: 0 0 auto;
      position: relative;
    }
    .anime-image-container img {
      width: 250px;
      border-radius: 10px;
    }
    .favorite-bubble {
      width: 35px;
      height: 35px;
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      z-index: 2;
    }
    .favorite-bubble:hover {
      transform: scale(1.1);
      box-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
    }
    .favorite-bubble.active {
      color: #ff4d4d;
      text-shadow: 0 0 6px #ff4d4d;
    }
    .anime-info {
      flex: 1;
      min-width: 250px;
    }
    .anime-info h1 {
      color: #f97316;
    }
    .anime-info p {
      margin: 0.5rem 0;
      color: #ccc;
      line-height: 1.6;
    }
    .section {
      margin-top: 3rem;
    }
    .character-list {
      display: flex;
      overflow-x: auto;
      gap: 1rem;
      scroll-behavior: smooth;
      padding: 1rem 2rem;
    }
    .character-list::-webkit-scrollbar {
      height: 8px;
    }
    .character-list::-webkit-scrollbar-thumb {
      background-color: #f97316;
      border-radius: 10px;
    }
    .character-bubble {
      width: 100px;
      flex-shrink: 0;
      text-align: center;
      color: inherit;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .character-bubble .img-wrapper {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 0 6px 2px #f97316;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .character-bubble:hover .img-wrapper {
      transform: scale(1.07);
      box-shadow: 0 0 12px 3px #f97316;
    }
    .character-bubble img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .character-name {
      margin-top: 0.5rem;
      font-weight: bold;
      font-size: 0.85rem;
      color: white;
      word-wrap: break-word;
    }
    .chapter-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
    }
    .chapter {
      background: #1e1e1e;
      padding: 1rem;
      border-radius: 8px;
      text-align: center;
    }
    .similar-section {
      padding: 2rem 0;
    }
    .similar-section h3 {
      color: #f97316;
      margin-bottom: 1rem;
      font-family: 'Oswald', sans-serif;
    }
    .related-list#similarList {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1rem;
    }
    .related-list#similarList a {
      background: #1f1f1f;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease;
      text-decoration: none;
      color: white;
      box-shadow: 0 0 5px rgba(249, 115, 22, 0.1);
    }
    .related-list#similarList a:hover {
      transform: scale(1.05);
      box-shadow: 0 0 8px rgba(249, 115, 22, 0.3);
    }
    .related-list#similarList img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-bottom: 2px solid #f97316;
    }
    .related-list#similarList div {
      padding: 0.5rem;
      text-align: center;
      font-size: 0.9rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
<header>
  <h1><a href="index.html" style="color: #f97316; text-decoration: none;">AnimeHub</a></h1>
  <nav>
    <a href="index.html">Anime</a>
    <a href="browse.html">Browse</a>
    <a href="calendar.html">Schedule</a>
    <a href="manga.html">Manga</a>
    <a href="manhwa.html">Manhwa</a>
    <a href="favorites.html" style="color:#f97316; font-weight:bold;">❤️</a>
  </nav>
</header>

<div class="container">
  <div id="mangaDetails"></div>

  <div class="section" id="characterSection">
    <h3>Characters</h3>
    <div class="character-list" id="characterList"></div>
  </div>

  <div class="section" id="chapterSection">
    <h3>Chapters</h3>
    <div class="chapter-list" id="chapterList"></div>
  </div>

  <div class="section similar-section" id="similarSection" style="display:none;">
    <h3>Similar Titles</h3>
    <div class="related-list" id="similarList"></div>
  </div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const mangaId = params.get('id');

let favKey = 'mangaFavorites';
let contentType = 'manga';

function isManhwa(genres, type) {
  return genres.some(g => g.name.toLowerCase() === 'manhwa') || (type && type.toLowerCase() === 'manhwa');
}

function isInFavorites(id) {
  const arr = JSON.parse(localStorage.getItem(favKey)) || [];
  return arr.some(item => String(item.id) === String(id));
}

function toggleFavorite(id, title, img) {
  const arr = JSON.parse(localStorage.getItem(favKey)) || [];
  const idx = arr.findIndex(i => String(i.id) === String(id));
  const btn = document.querySelector(`.favorite-bubble[data-id="${id}"]`);
  if (idx > -1) {
    arr.splice(idx, 1);
    btn.classList.remove('active');
  } else {
    arr.push({ id: String(id), title, imageUrl: img, type: contentType });
    btn.classList.add('active');
  }
  btn.textContent = btn.classList.contains('active') ? '💖' : '❤️';
  localStorage.setItem(favKey, JSON.stringify(arr));
}

function markFav(id) {
  const btn = document.querySelector(`.favorite-bubble[data-id="${id}"]`);
  if (!btn) return;
  const act = isInFavorites(id);
  btn.classList.toggle('active', act);
  btn.textContent = act ? '💖' : '❤️';
}

// === SIMILAR INFINITE SCROLL LOGIC ===
let similarPage = 1;
let isLoadingSimilar = false;
let currentMangaId = null;
let similarResults = [];
let genreIndex = 0;
let genrePageMap = {};
let allGenreIds = [];
let currentType = 'manga';

function calculateRelevance(itemGenres, baseGenreIds) {
  const itemIds = itemGenres.map(g => g.mal_id);
  return itemIds.filter(id => baseGenreIds.includes(id)).length;
}

function renderSimilar(data) {
  const list = document.getElementById("similarList");
  list.innerHTML = data.map(m => `
    <a href="manga-details.html?id=${m.mal_id}" class="related">
      <img src="${m.images.jpg.image_url}" alt="${m.title}">
      <div>${m.title}</div>
    </a>`).join('');
}

async function fetchSimilarScroll() {
  if (isLoadingSimilar || allGenreIds.length === 0) return;
  isLoadingSimilar = true;

  const genreId = allGenreIds[genreIndex % allGenreIds.length];
  const page = genrePageMap[genreId] || 1;

  try {
    const res = await fetch(`https://api.jikan.moe/v4/manga?genres=${genreId}&order_by=popularity&sort=desc&type=${currentType}&page=${page}`);
    const json = await res.json();

    if (!json || !Array.isArray(json.data)) {
      genrePageMap[genreId] = 1;
      genreIndex++;
      isLoadingSimilar = false;
      return fetchSimilarScroll(); // move to next genre
    }

    const filtered = json.data.filter(item => item.mal_id !== currentMangaId);

    for (const item of filtered) {
      if (!similarResults.find(m => m.mal_id === item.mal_id)) {
        const score = calculateRelevance(item.genres, allGenreIds);
        similarResults.push({ ...item, _score: score });
      }
    }

    genrePageMap[genreId] = page + 1;
    genreIndex++;

    similarResults.sort((a, b) => b._score - a._score);
    renderSimilar(similarResults);
  } catch (err) {
    console.error('Error fetching similar manga:', err);
  } finally {
    isLoadingSimilar = false;
  }
}

function setupSimilarScroll() {
  const list = document.getElementById("similarList");
  list.addEventListener('scroll', () => {
    if (list.scrollTop + list.clientHeight >= list.scrollHeight - 50) {
      fetchSimilarScroll();
    }
  });
}

async function fetchSimilar(genres, malId, type = 'manga') {
  if (!genres || !Array.isArray(genres) || genres.length === 0) return;

  allGenreIds = genres.map(g => g.mal_id);
  genrePageMap = {};
  genreIndex = 0;
  currentMangaId = malId;
  currentType = type.toLowerCase();
  similarResults = [];

  const container = document.getElementById("similarSection");
  const list = document.getElementById("similarList");
  container.style.display = 'block';
  list.innerHTML = '';

  await fetchSimilarScroll(); // load first batch
  setupSimilarScroll();
}

// === MANGA DETAILS ===
async function fetchMangaDetails() {
  document.getElementById('mangaDetails').innerHTML = '<p>Loading...</p>';
  try {
    const res = await fetch(`https://api.jikan.moe/v4/manga/${mangaId}/full`);
    const { data } = await res.json();
    const img = data.images.jpg.large_image_url;

    if (isManhwa(data.genres, data.type)) {
      favKey = 'manhwaFavorites';
      contentType = 'manhwa';
    }

    document.getElementById('mangaDetails').innerHTML = `
      <div class="anime-detail-header">
        <div class="anime-image-container">
          <img src="${img}" alt="">
          <div class="favorite-bubble" data-id="${data.mal_id}">❤️</div>
        </div>
        <div class="anime-info">
          <h1>${data.title}</h1>
          <p><strong>Synopsis:</strong> <span id="synopsis-text">${(data.synopsis || 'No synopsis.').slice(0, 300)}</span><span id="dots">...</span><span id="more-text" style="display:none;">${(data.synopsis || '').slice(300)}</span>
          <button id="read-more-btn" style="background:none; border:none; color:#f97316; cursor:pointer; font-weight:bold;">Read more</button></p>
          <p><strong>Type:</strong> ${data.type}</p>
          <p><strong>Status:</strong> ${data.status}</p>
          <p><strong>Chapters:</strong> ${data.chapters || 'Unknown'}</p>
          <p><strong>Score:</strong> ${data.score || 'N/A'}</p>
          <p><strong>Published:</strong> ${data.published.string}</p>
        </div>
      </div>`;

    const btn = document.querySelector(`.favorite-bubble[data-id="${data.mal_id}"]`);
    btn.addEventListener('click', () => toggleFavorite(data.mal_id, data.title, img));
    markFav(data.mal_id);

    document.getElementById('read-more-btn').addEventListener('click', () => {
      const dots = document.getElementById('dots');
      const moreText = document.getElementById('more-text');
      const btn = document.getElementById('read-more-btn');
      if (dots.style.display === 'none') {
        dots.style.display = 'inline';
        moreText.style.display = 'none';
        btn.textContent = 'Read more';
      } else {
        dots.style.display = 'none';
        moreText.style.display = 'inline';
        btn.textContent = 'Read less';
      }
    });

    fetchSimilar(data.genres, data.mal_id, data.type);
  } catch (e) {
    document.getElementById('mangaDetails').innerHTML = '<p>Error loading details.</p>';
  }
}

async function fetchCharacters() {
  const res = await fetch(`https://api.jikan.moe/v4/manga/${mangaId}/characters`);
  const { data } = await res.json();
  if (!data || data.length === 0) {
    document.getElementById('characterSection').remove();
    return;
  }
  const html = data.map(c => `
    <a href="character.html?id=${c.character.mal_id}" class="character-bubble">
      <div class="img-wrapper">
        <img src="${c.character.images.jpg.image_url}" alt="">
      </div>
      <div class="character-name">${c.character.name}</div>
    </a>`).join('');
  document.getElementById('characterList').innerHTML = html;
}

async function fetchChapters() {
  const res = await fetch(`https://api.jikan.moe/v4/manga/${mangaId}/chapters`);
  const { data } = await res.json();
  if (!data || data.length === 0) {
    document.getElementById('chapterSection').remove();
    return;
  }
  const html = data.slice(0, 20).map(c => `
    <div class="chapter">
      <strong>Chapter ${c.mal_id}</strong>
      <p>${c.title || 'Untitled'}</p>
    </div>`).join('');
  document.getElementById('chapterList').innerHTML = html;
}

fetchMangaDetails();
fetchCharacters();
fetchChapters();
</script>



</body>
</html>
