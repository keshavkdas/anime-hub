<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Anime Details | AnimeHub</title>
  <link rel="icon" href="favicon.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=Poppins:wght@500&display=swap" rel="stylesheet">
  <style>
    /* Global Styles */
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    header {
      background: #1f1f1f;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #333;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    header h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 2rem;
      margin: 0;
      color: #f97316;
      letter-spacing: -0.5px;
      font-weight: 600;
    }

    nav a {
      color: #fff;
      margin-left: 1.5rem;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }
    nav a:hover,
    nav a[href$=".html"][href*="index.html"] {
      color: #f97316;
    }

    /* Container */
    .anime-details-container {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 2rem;
      background: #1f1f1f;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Header inside details */
    .anime-detail-header {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
    }
    .anime-detail-header img {
      max-width: 300px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    /* Text info */
    .anime-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .anime-info h1 {
      font-size: 2.75rem;
      margin: 0;
      color: #f97316;
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
    }
    .anime-info p {
      margin: 0;
      font-size: 1rem;
      line-height: 1.6;
      color: #ccc;
    }

    /* Buttons */
    button, .dive-button {
      background: #f97316;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover, .dive-button:hover {
      background: #fb923c;
    }

    /* Spinner */
    .loading-spinner {
      margin: 2rem auto;
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 4px solid #f97316;
      border-top-color: transparent;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Synopsis */
    .anime-info .read-more-btn {
      color: #f97316;
      cursor: pointer;
      font-weight: bold;
    }
    .anime-info .synopsis-text {
      display: -webkit-box;
      -webkit-line-clamp: 5;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Trailer */
    .anime-trailer {
      max-width: 900px;
      margin: 2rem auto;
    }
    .anime-trailer iframe {
      width: 100%;
      height: 500px;
      border: 2px solid #f97316;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    @media (max-width: 768px) {
      .anime-trailer iframe { height: 300px; }
      .anime-detail-header {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .anime-detail-header img {
        max-width: 100%;
      }
      .anime-info h1 { font-size: 2rem; }
    }

    /* Characters */
    .character-bubbles {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      padding: 1rem 0;
      scrollbar-width: thin;
      scrollbar-color: #f97316 #1f1f1f;
    }
    .character-bubbles::-webkit-scrollbar {
      height: 8px;
    }
    .character-bubbles::-webkit-scrollbar-track {
      background: #1f1f1f;
    }
    .character-bubbles::-webkit-scrollbar-thumb {
      background: #f97316;
      border-radius: 4px;
    }
    .character-bubble {
      flex: 0 0 auto;
      text-align: center;
    }
    .character-bubble img {
      width: 80px; height: 80px;
      border-radius: 50%;
      border: 2px solid #f97316;
      box-shadow: 0 0 10px rgba(249,115,22,0.4);
      transition: transform 0.3s ease;
    }
    .character-bubble img:hover {
      transform: scale(1.1);
    }
    .character-name {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
    }

    /* Favorite bubble */
    .favorite-bubble {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.6);
      border-radius: 50%;
      padding: 8px;
      font-size: 24px;
      color: #fff;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }
    .favorite-bubble:hover {
      transform: scale(1.1);
      box-shadow: 0 0 10px rgba(255,0,0,0.6);
    }
    .favorite-bubble.active {
      color: #ff4d4d;
      text-shadow: 0 0 8px #ff4d4d;
    }

    /* Back to Top */
    #backToTop {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      width: 48px; height: 48px;
      font-size: 1.5rem;
      background: rgba(0,0,0,0.4);
      border: 2px solid #f97316;
      border-radius: 50%;
      color: #f97316;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(249,115,22,0.3);
      transition: transform 0.3s ease, background 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    #backToTop:hover {
      transform: scale(1.1);
      background: rgba(255,121,18,0.1);
    }

    /* Carousel (scene images) */
    .scene-carousel-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      height: 520px;
    }
    .carousel-window {
      width: 100%;
      overflow: hidden;
      position: relative;
    }
    .carousel-track {
      display: flex;
      transition: transform 0.5s ease-in-out;
    }
    .carousel-slide {
      flex: 0 0 60%;
      margin: 0 1%;
      position: relative;
      border-radius: 10px;
      overflow: hidden;
    }
    .carousel-slide img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
    }
    .carousel-slide.center {
      transform: scale(1.05);
      z-index: 2;
    }
    .carousel-slide.blur-left::after,
    .carousel-slide.blur-right::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      border-radius: 10px;
      z-index: 1;
    }
    .prev, .next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: none;
      font-size: 2rem;
      padding: 1rem;
      cursor: pointer;
      z-index: 3;
      border-radius: 4px;
    }
    .prev { left: 10px; }
    .next { right: 10px; }
  </style>
</head>
<body>
  <header>
    <h1>AnimeHub</h1>
    <nav>
      <a href="index.html">Anime</a>
      <a href="browse.html">Browse</a>
      <a href="calendar.html">Schedule</a>
      <a href="/manga.html">Manga</a>
      <a href="/manhwa.html">Manhwa</a>
      <a href="favorites.html" style="color: #f97316; font-weight: 600;">❤️</a>
    </nav>
  </header>

  <main class="anime-details-container" id="animeDetails">
    <div class="loading-spinner"></div>
    <p>Loading anime details...</p>
    <div class="scene-block">
      <div class="scene-carousel-wrapper">
        <div class="carousel-window">
          <div class="carousel-track"></div>
        </div>
        <button class="prev">❮</button>
        <button class="next">❯</button>
      </div>
    </div>
  </main>

  <button id="backToTop">⮝</button>

 <script>
async function fetchAnimeDetails() {
  const urlParams = new URLSearchParams(window.location.search);
  const animeId = urlParams.get('id');
  const container = document.getElementById("animeDetails");
  container.innerHTML = `<div class="loading-spinner"></div><p>Loading details...</p>`;

  try {
    const res = await fetch(`https://api.jikan.moe/v4/anime/${animeId}`);
    const { data } = await res.json();
    const title = data.title;
    const img = data.images.jpg.large_image_url;

    container.innerHTML = `
      <div class="anime-detail-header">
        <div class="anime-image-container">
          <img src="${img}" alt="${title}">
          <div class="favorite-bubble fav-btn" data-id="${data.mal_id}" onclick="addToFavorites('${data.mal_id}', \`${title}\`, '${img}')">❤️</div>
        </div>
        <div class="anime-info">
          <h1>${title}</h1>
          <p><strong>Synopsis:</strong> <span class="synopsis-text">${
            data.synopsis?.substring(0, 200) || 'No synopsis available.'
          }${data.synopsis && data.synopsis.length > 200 ? '...' : ''}</span>
          ${data.synopsis?.length > 200 ? '<span class="read-more-btn">Read More</span>' : ''}</p>
          <p><strong>Type:</strong> ${data.type}</p>
          <p><strong>Episodes:</strong> ${data.episodes}</p>
          <p><strong>Status:</strong> ${data.status}</p>
          <p><strong>Score:</strong> ${data.score || 'N/A'}</p>
          <p><strong>Aired:</strong> ${data.aired.string}</p>
          <p><strong>Genres:</strong> ${data.genres.map(g => g.name).join(', ')}</p>
        </div>
      </div>
    `;

    document.querySelector('.read-more-btn')?.addEventListener('click', e => {
      const span = e.target.previousElementSibling;
      span.textContent = data.synopsis;
      e.target.remove();
    });

    markFavoriteBubble(data.mal_id); // update fav bubble on load

    // Trailer
    if (data.trailer?.embed_url?.includes("youtube.com")) {
      const trailerWrapper = document.createElement("div");
      trailerWrapper.className = "anime-trailer";
      trailerWrapper.innerHTML = `
        <iframe src="${data.trailer.embed_url}" width="100%" height="500" frameborder="0" allowfullscreen></iframe>
      `;
      container.appendChild(trailerWrapper);
    } else {
      const imgRes = await fetch(`https://api.jikan.moe/v4/anime/${data.mal_id}/pictures`);
      const imgData = await imgRes.json();
      const pictures = imgData.data;

      if (pictures.length > 0) {
        const sceneBlock = document.createElement('div');
        sceneBlock.className = 'scene-block';
        sceneBlock.innerHTML = `
          <div class="scene-carousel-wrapper">
            <button class="prev">❮</button>
            <div class="carousel-window">
              <div class="carousel-track"></div>
            </div>
            <button class="next">❯</button>
          </div>
        `;
        container.appendChild(sceneBlock);

        const track = sceneBlock.querySelector('.carousel-track');
        pictures.forEach(pic => {
          const url = pic.jpg.large_image_url || pic.jpg.image_url;
          const slide = document.createElement('div');
          slide.className = 'carousel-slide';
          slide.innerHTML = `<img src="${url}" alt="scene" />`;
          track.appendChild(slide);
        });

        let idx = 0;
        const slides = track.querySelectorAll('.carousel-slide');

        function update() {
          slides.forEach((slide, i) => {
            slide.classList.remove('center', 'blur-left', 'blur-right');
            if (i === idx) slide.classList.add('center');
            else if (i === (idx - 1 + slides.length) % slides.length) slide.classList.add('blur-left');
            else if (i === (idx + 1) % slides.length) slide.classList.add('blur-right');
          });

          const slideWidth = slides[idx].offsetWidth;
          const margin = 16;
          const totalOffset = (slideWidth + margin) * idx;
          const centerOffset = (track.offsetWidth / 2) - (slideWidth / 2);
          track.style.transform = `translateX(-${totalOffset - centerOffset}px)`;
        }

        sceneBlock.querySelector('.prev').onclick = () => {
          idx = (idx - 1 + slides.length) % slides.length;
          update();
        };
        sceneBlock.querySelector('.next').onclick = () => {
          idx = (idx + 1) % slides.length;
          update();
        };

        setInterval(() => {
          idx = (idx + 1) % slides.length;
          update();
        }, 5000);

        update();
      }
    }

    // Characters
    const charRes = await fetch(`https://api.jikan.moe/v4/anime/${data.mal_id}/characters`);
    const charData = await charRes.json();

    container.insertAdjacentHTML('beforeend', '<h2>Characters</h2><div id="characterContainer" class="character-bubbles"></div>');
    const charContainer = document.getElementById('characterContainer');
    charContainer.innerHTML = charData.data.map(c => `
      <div class="character-bubble">
        <a href="character.html?id=${c.character.mal_id}">
          <img src="${c.character.images.jpg.image_url}" alt="${c.character.name}">
        </a>
        <div class="character-name">${c.character.name}</div>
      </div>
    `).join('');

  } catch (err) {
    console.error(err);
    container.innerHTML = `
      <a href="index.html" class="back-link">← Back to Home</a>
      <p>Failed to load anime details. Please try again later.</p>
    `;
  }
}

fetchAnimeDetails();

// Favorite Functions
function isInFavorites(id) {
  const favs = JSON.parse(localStorage.getItem('animeFavorites')) || [];
  return favs.some(fav => String(fav.id) === String(id));
}

function addToFavorites(id, title, imageUrl) {
  try {
    const favs = JSON.parse(localStorage.getItem('animeFavorites')) || [];
    const index = favs.findIndex(fav => String(fav.id) === String(id));
    const heartBtn = document.querySelector(`.favorite-bubble[data-id="${id}"]`);

    if (index > -1) {
      favs.splice(index, 1);
      if (heartBtn) {
        heartBtn.textContent = '❤️';
        heartBtn.classList.remove('active');
      }
    } else {
      favs.push({ id: String(id), title: title.trim(), imageUrl: imageUrl.trim(), type: 'anime' });
      if (heartBtn) {
        heartBtn.textContent = '💖';
        heartBtn.classList.add('active');
      }
    }

    localStorage.setItem('animeFavorites', JSON.stringify(favs));
  } catch (err) {
    console.error('Error toggling favorite:', err);
  }
}

function markFavoriteBubble(id) {
  const heartBtn = document.querySelector(`.favorite-bubble[data-id="${id}"]`);
  if (!heartBtn) return;

  const isFav = isInFavorites(id);
  heartBtn.classList.toggle('active', isFav);
  heartBtn.textContent = isFav ? '💖' : '❤️';
}

// Back to Top
const btn = document.getElementById('backToTop');
btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
window.addEventListener('scroll', () => {
  btn.style.display = window.scrollY > 300 ? 'block' : 'none';
});
</script>
</body>
</html>
