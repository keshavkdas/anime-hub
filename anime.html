<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Anime Details</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.ico" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=Poppins:wght@500&display=swap');

    body {
      margin: 0;
      background: #121212;
      font-family: 'Poppins', sans-serif;
      color: white;
    }

    header {
      background-color: #1f1f1f;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 2rem;
      color: #f97316;
    }

    nav a {
      color: white;
      margin-left: 2rem;
      text-decoration: none;
      font-weight: 600;
    }

    nav a:hover {
      color: #f97316;
    }

    .anime-detail-header {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      padding: 2rem;
    }

    .anime-image-container {
/*       position: relative;
      max-width: 300px;
      flex: 1; */
      flex: 0 0 auto;
      position: relative;
    }

    .anime-image-container img {
/*       width: 100%;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.4); */
      width: 250px;
      border-radius: 10px;
    }

    .favorite-bubble {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.6);
      color: #f97316;
      font-size: 24px;
      padding: 10px;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      z-index: 10;
    }

    .favorite-bubble:hover {
      transform: scale(1.15);
      box-shadow: 0 0 10px #f97316;
    }

    .favorite-bubble.active {
      color: #ff4d4d;
      text-shadow: 0 0 8px #ff4d4d;
    }

    .anime-info {
      flex: 2;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .anime-info h1 {
      color: #f97316;
      font-size: 2.5rem;
      margin: 0;
    }

    .anime-info p {
      margin: 0;
      line-height: 1.6;
    }

    .read-more-btn {
      color: #f97316;
      cursor: pointer;
      font-weight: bold;
    }

    .anime-trailer {
      padding: 2rem;
    }

    .anime-trailer iframe {
      width: 100%;
      height: 500px;
      border: 2px solid #f97316;
      border-radius: 10px;
    }

    .character-list {
      display: flex;
      overflow-x: auto;
      gap: 1rem;
      scroll-behavior: smooth;
      padding: 1rem 2rem;
    }

    .character-list::-webkit-scrollbar {
      height: 8px;
    }

    .character-list::-webkit-scrollbar-thumb {
      background-color: #f97316;
      border-radius: 10px;
    }

    .character-list {
      scrollbar-color: #f97316 transparent;
      scrollbar-width: thin;
    }

    .character-bubble {
  width: 100px;
  flex-shrink: 0;
  text-align: center;
  color: inherit;
  text-decoration: none;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.character-bubble .img-wrapper {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  overflow: hidden;
  box-shadow: 0 0 6px 2px #f97316;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.character-bubble:hover .img-wrapper {
  transform: scale(1.07);
  box-shadow: 0 0 12px 3px #f97316;
}

    .character-bubble img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .character-name {
      margin-top: 0.5rem;
      font-weight: bold;
      font-size: 0.85rem;
      color: white;
      text-align: center;
    }

    .loading-spinner {
      border: 4px solid #f97316;
      border-top: 4px solid transparent;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 3rem auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .anime-detail-header {
        flex-direction: column;
        align-items: center;
      }
      .anime-info {
        text-align: center;
        align-items: center;
      }
      .anime-trailer iframe {
        height: 300px;
      }
    }
    .similar-section {
  padding: 2rem;
}

.similar-section h2 {
  color: #f97316;
  margin-bottom: 1rem;
  font-family: 'Oswald', sans-serif;
}

.similar-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 1rem;
}

.similar-card {
  background: #1f1f1f;
  border-radius: 8px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.2s ease;
}

.similar-card:hover {
  transform: scale(1.05);
}

.similar-card img {
  width: 100%;
  height: 240px;
  object-fit: cover;
}

.similar-card-title {
  padding: 0.5rem;
  text-align: center;
  font-size: 0.9rem;
  color: white;
  font-weight: bold;
}
    .similar-loading {
  display: flex;
  justify-content: center;
  margin-top: 2rem;
}


  </style>
</head>
<body>
  <header>
    <h1><a href="index.html" style="color: #f97316; text-decoration: none;">AnimeHub</a></h1>
    <nav>
      <a href="index.html">Anime</a>
      <a href="browse.html">Browse</a>
      <a href="calendar.html">Schedule</a>
      <a href="manga.html">Manga</a>
      <a href="manhwa.html">Manhwa</a>
      <a href="favorites.html" style="color:#f97316;">❤️</a>
    </nav>
  </header>

  <main id="animeDetails" style="padding-bottom: 3rem;">
    <div class="loading-spinner"></div>
    <p style="text-align:center;">Loading anime details...</p>
  </main>

  <script>

    let similarAnimeList = [];
    let similarPage = 0;
    let isLoadingMoreSimilar = false;
    let similarFallbackMode = false;
    let fallbackPage = 1;
    let similarGenres = [];
    let shownAnimeIds = new Set();
    let currentAnimeId = null;


    async function fetchAnimeDetails() {
      const urlParams = new URLSearchParams(window.location.search);
      const animeId = urlParams.get('id');
      currentAnimeId = parseInt(animeId);
      const container = document.getElementById("animeDetails");
      container.innerHTML = `<div class="loading-spinner"></div><p>Loading details...</p>`;

      try {
        const res = await fetch(`https://api.jikan.moe/v4/anime/${animeId}/full`);
        const { data } = await res.json();
        const title = data.title;
        const img = data.images.jpg.large_image_url;

        container.innerHTML = `
          <div class="anime-detail-header">
            <div class="anime-image-container">
              <img src="${img}" alt="${title}">
              <div class="favorite-bubble" data-id="${data.mal_id}" onclick="toggleFavorite('${data.mal_id}', \`${title}\`, '${img}')">❤️</div>
            </div>
            <div class="anime-info">
              <h1>${title}</h1>
              <p><strong>Synopsis:</strong> <span class="synopsis-text">${
                data.synopsis?.substring(0, 200) || 'No synopsis available.'
              }${data.synopsis && data.synopsis.length > 200 ? '...' : ''}</span>
              ${data.synopsis?.length > 200 ? '<span class="read-more-btn">Read More</span>' : ''}</p>
              <p><strong>Type:</strong> ${data.type}</p>
              <p><strong>Episodes:</strong> ${data.episodes}</p>
              <p><strong>Status:</strong> ${data.status}</p>
              <p><strong>Score:</strong> ${data.score || 'N/A'}</p>
              <p><strong>Aired:</strong> ${data.aired.string}</p>
              <p><strong>Genres:</strong> ${data.genres.map(g => g.name).join(', ')}</p>
              
            </div>
          </div>
        `;
        similarGenres = data.genres.map(g => g.mal_id);

        document.querySelector('.read-more-btn')?.addEventListener('click', e => {
          const span = e.target.previousElementSibling;
          span.textContent = data.synopsis;
          e.target.remove();
        });

        markFavoriteBubble(data.mal_id);

        // Trailer
        if (data.trailer && data.trailer.embed_url) {
          const trailerBlock = document.createElement('div');
          trailerBlock.className = 'anime-trailer';
          trailerBlock.innerHTML = `
          <h2 style="padding-left:2rem;"></h2>
          <iframe src="${data.trailer.embed_url}" frameborder="0" allowfullscreen></iframe>
        `;
        container.appendChild(trailerBlock);
        }

        // Characters
        const charRes = await fetch(`https://api.jikan.moe/v4/anime/${data.mal_id}/characters`);
        const charData = await charRes.json();

        if (charData.data.length > 0) {
          const html = `
            <h2 style="padding-left:2rem;"></h2>
            <div class="character-list" id="characterContainer">
              ${charData.data.map(c => `
                <a href="character.html?id=${c.character.mal_id}" class="character-bubble">
                  <div class="img-wrapper">
                    <img src="${c.character.images.jpg.image_url}" alt="${c.character.name}">
                  </div>
                  <div class="character-name">${c.character.name}</div>
                </a>
              `).join('')}
            </div>
          `;
          container.insertAdjacentHTML('beforeend', html);
        }
          // Load Similar Anime (once)
          const recRes = await fetch(`https://api.jikan.moe/v4/anime/${data.mal_id}/recommendations`);
          const recJson = await recRes.json();
          similarAnimeList = recJson.data
            .filter(rec => rec.entry && rec.entry.mal_id !== currentAnimeId)
            .sort((a, b) => (b.votes || 0) - (a.votes || 0));
          similarAnimeList.forEach(rec => shownAnimeIds.add(rec.entry.mal_id));
          similarPage = 0;

          if (similarAnimeList.length > 0) {
            const similarSection = document.createElement('section');
            similarSection.className = 'similar-section';
            similarSection.id = 'similarSection';
            similarSection.innerHTML = `
              <h2>Similar Anime</h2>
              <div class="similar-grid" id="similarGrid"></div>
              <div class="similar-loading" id="similarLoading" style="display:none;">
                <div class="loading-spinner"></div>
              </div>
            `;
            container.appendChild(similarSection);
            document.getElementById("similarLoading").style.display = 'flex';
            loadMoreSimilarAnime(); // initial load
          }

      } catch (err) {
        console.error(err);
        container.innerHTML = `
          <p style="text-align:center;">Failed to load anime details. Please try again later.</p>
        `;
      }
    }

function loadMoreSimilarAnime() {
  if (isLoadingMoreSimilar) return;
  isLoadingMoreSimilar = true;

  const grid = document.getElementById("similarGrid");
  const loadingEl = document.getElementById("similarLoading");
  if (loadingEl) loadingEl.style.display = 'flex';

  // Phase 1: Load from recommendations
  if (!similarFallbackMode && similarPage * 10 < similarAnimeList.length) {
    const batch = similarAnimeList.slice(similarPage * 10, (similarPage + 1) * 10);
    batch.forEach(rec => {
      if (!shownAnimeIds.has(rec.entry.mal_id)) {
        shownAnimeIds.add(rec.entry.mal_id);
        const card = document.createElement("div");
        card.className = "similar-card";
        card.onclick = () => {
          if (window.location.search.includes(`id=${rec.entry.mal_id}`)) {
              window.location.reload(); // same ID? reload forcibly
          } else {
             window.location.href = `anime.html?id=${rec.entry.mal_id}`;
          }
        };
        card.innerHTML = `
          <img src="${rec.entry.images.jpg.large_image_url}" alt="${rec.entry.title}">
          <div class="similar-card-title">${rec.entry.title}</div>
        `;
        grid.appendChild(card);
      }
    });
    similarPage++;
    if (similarPage * 10 >= similarAnimeList.length) {
      similarFallbackMode = true;
    }
    isLoadingMoreSimilar = false;
    if (loadingEl) loadingEl.style.display = 'none';
    return;
  }

  // Phase 2: Genre fallback
  if (similarFallbackMode && similarGenres.length > 0) {
    fetch(`https://api.jikan.moe/v4/anime?genres=${similarGenres.join(',')}&order_by=popularity&sort=desc&page=${fallbackPage}`)
      .then(r => r.json())
      .then(json => {
        const fallbackResults = json.data || [];
        fallbackResults.forEach(item => {
          if (!shownAnimeIds.has(item.mal_id) && item.mal_id !== currentAnimeId) {
            shownAnimeIds.add(item.mal_id);
            const card = document.createElement("div");
            card.className = "similar-card";
            card.onclick = () => location.href = `anime.html?id=${item.mal_id}`;
            card.innerHTML = `
              <img src="${item.images.jpg.large_image_url}" alt="${item.title}">
              <div class="similar-card-title">${item.title}</div>
            `;
            grid.appendChild(card);
          }
        });
        fallbackPage++;
        isLoadingMoreSimilar = false;
        if (loadingEl) loadingEl.style.display = 'none';
      })
      .catch(err => {
        console.error("Fallback similar fetch failed", err);
        isLoadingMoreSimilar = false;
        if (loadingEl) loadingEl.style.display = 'none';
      });
  }
}


    function isInFavorites(id) {
      const favs = JSON.parse(localStorage.getItem('animeFavorites')) || [];
      return favs.some(fav => String(fav.id) === String(id));
    }

    function toggleFavorite(id, title, imageUrl) {
      const favs = JSON.parse(localStorage.getItem('animeFavorites')) || [];
      const index = favs.findIndex(fav => String(fav.id) === String(id));
      const btn = document.querySelector(`.favorite-bubble[data-id="${id}"]`);

      if (index > -1) {
        favs.splice(index, 1);
        btn.textContent = '❤️';
        btn.classList.remove('active');
      } else {
        favs.push({ id: String(id), title, imageUrl, type: 'anime' });
        btn.textContent = '💖';
        btn.classList.add('active');
      }

      localStorage.setItem('animeFavorites', JSON.stringify(favs));
    }

    function markFavoriteBubble(id) {
      const btn = document.querySelector(`.favorite-bubble[data-id="${id}"]`);
      if (!btn) return;
      const isFav = isInFavorites(id);
      btn.classList.toggle('active', isFav);
      btn.textContent = isFav ? '💖' : '❤️';
    }
    window.addEventListener("scroll", () => {
      const section = document.getElementById("similarSection");
      if (section && !isLoadingMoreSimilar) {
        const { bottom } = section.getBoundingClientRect();
        if (bottom < window.innerHeight + 300) {
          loadMoreSimilarAnime();
        }
      }
    });

    fetchAnimeDetails();
  </script>
</body>
</html>
