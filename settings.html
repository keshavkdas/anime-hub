<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings – AnimeHub</title>
  <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #0f0f0f, #1f1f1f);
      color: #f0f0f0;
    }

    .container {
      max-width: 480px;
      margin: 40px auto;
      background-color: #161b22;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #ff6600;
    }

    label {
      display: block;
      margin: 12px 0 4px;
      font-weight: 500;
    }

    input {
      width: 90%;
      padding: 10px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background-color: #0d1117;
      color: #ff6600;
      font-size: 15px;
    }

    .section {
      margin-bottom: 30px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      background-color: #ff6600;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .avatar-tray, .overlay-avatars {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 10px 0;
    }

    .avatar-bubble {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      position: relative;
      transition: all 0.3s ease-in-out;
    }

    .avatar-bubble img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-bubble.selected-center {
      border: 3px solid #ff6600;
      transform: scale(1.1);
      box-shadow: 0 0 10px #ff6600;
    }

    #avatar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    #avatar-overlay.active {
      display: flex;
    }

    #overlay-box {
      background: #161b22;
      width: 420px;
      padding: 20px;
      border-radius: 10px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }

    #close-overlay {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #0d1117;
      color: #ff6600;
      border: 1px solid #ff6600;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      font-size: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    input[type="date"] {
      background-color: #0d1117;
      color: #ff6600;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 10px;
      font-size: 15px;
      width: 90%;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Settings</h2>

    <div class="section">
      <label>Email</label>
      <input type="email" id="email" readonly disabled />

      <label>Password</label>
      <input type="password" id="password" />
      <button onclick="updateEmailPassword()">Update Password</button>
    </div>

    <div class="section">
      <label>Full Name</label>
      <input type="text" id="full-name" />

      <label>Date of Birth</label>
      <input type="text" id="dob" readonly />

      <button onclick="updateProfile()">Update Profile</button>
    </div>

    <div class="section">
      <label>Avatar</label>
      <div class="avatar-tray" id="avatar-tray"></div>
      <button onclick="toggleOverlay()">Change Avatar</button>
    </div>

    <div class="section">
      <label>Phone Number</label>
      <input type="text" id="phone" />
      <button onclick="sendOTP()">Verify & Save</button>
    </div>
  </div>

  <div id="avatar-overlay">
    <div id="overlay-box">
      <button id="close-overlay" onclick="toggleOverlay()">✖</button>
      <input type="text" id="search-bar" placeholder="Search for character..." />
      <div class="overlay-avatars" id="overlay-avatars"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script>
    const API_BASE = "https://anime-hub-auth.keshavkdas23.workers.dev";
const user = JSON.parse(localStorage.getItem("user"));
const uid = user?.uid;
let selectedAvatar = "";

if (!uid) {
  alert("User not logged in.");
  window.location.href = "index.html";
}

async function fetchKVProfile() {
  const res = await fetch(API_BASE, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "getProfile", uid })
  });
  const data = await res.json();
  return data.success ? data.profile : {};
}

async function updatePassword() {
  const password = document.getElementById("password").value.trim();
  if (!password) return alert("Password required.");

  const res = await fetch(API_BASE, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "saveEmail", uid, email: user.email, password })
  });

  const result = await res.json();
  if (result.success) {
    alert("✅ Password updated.");
  } else {
    alert("❌ Failed to update password.");
  }
}

async function updateProfile() {
  const fullName = document.getElementById("full-name").value.trim();
  const dob = document.getElementById("dob").value;
  const [first, ...lastParts] = fullName.split(" ");
  const last = lastParts.join(" ");

  const phone = document.getElementById("phone").value.trim();

  const profile = {
    first, last, dob, avatar: selectedAvatar, phone
  };

  await fetch(API_BASE, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "saveProfile", uid, profile })
  });

  localStorage.setItem("profile", JSON.stringify(profile));
  alert("✅ Profile updated.");
}

async function prefillSettings() {
  const profile = await fetchKVProfile();
  if (!profile) return;

  document.getElementById("email").value = user.email || "";
  document.getElementById("password").value = "";
  document.getElementById("full-name").value = `${profile.first || ""} ${profile.last || ""}`;
  document.getElementById("dob").value = profile.dob || "";
  document.getElementById("phone").value = profile.phone || "";
  selectedAvatar = profile.avatar || "";

  renderTray();
}

function renderTray() {
  const tray = document.getElementById("avatar-tray");
  tray.innerHTML = "";

  const div = document.createElement("div");
  div.className = "avatar-bubble selected-center";
  div.innerHTML = `<img src="${selectedAvatar}" alt="Selected Avatar" />`;
  tray.appendChild(div);
}

function toggleOverlay() {
  document.getElementById("avatar-overlay").classList.toggle("active");
  if (document.getElementById("avatar-overlay").classList.contains("active")) {
    loadOverlayAvatars();
  }
}

async function fetchCharacters(pageNum = 1) {
  const res = await fetch(`https://api.jikan.moe/v4/characters?page=${pageNum}&limit=25&order_by=favorites&sort=desc`);
  const data = await res.json();
  return data.data.map(c => ({ name: c.name, src: c.images.jpg.image_url }));
}

async function loadOverlayAvatars() {
  const container = document.getElementById("overlay-avatars");
  container.innerHTML = "";
  const characters = await fetchCharacters();
  characters.forEach(char => {
    const div = document.createElement("div");
    div.className = "avatar-bubble";
    div.innerHTML = `<img src="${char.src}" alt="${char.name}" title="${char.name}" />`;
    div.onclick = () => {
      selectedAvatar = char.src;
      renderTray();
      toggleOverlay();
    };
    container.appendChild(div);
  });
}

function sendOTP() {
  alert("📱 Firebase OTP logic not implemented yet.\nUse Firebase `signInWithPhoneNumber()` here.");
}

flatpickr("#dob", {
  dateFormat: "Y-m-d",
  maxDate: "today"
});

document.addEventListener("DOMContentLoaded", prefillSettings);
  </script>
</body>
</html>
