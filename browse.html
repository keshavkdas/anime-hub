<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Browse Anime - AnimeHub</title>
  <link rel="stylesheet" href="responsive.css" />
  <script src="responsive.js" defer></script>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&family=Poppins&display=swap" rel="stylesheet">
  
<style>
  /* ========== General Styles ========== */
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background-color: #121212;
  color: #ffffff;
}

    header {
      background-color: #1f1f1f;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 2rem;
      color: #f97316;
    }

    nav a {
      color: white;
      margin-left: 2rem;
      font-family: 'Poppins', sans-serif;
      text-decoration: none;
      font-weight: 600;
    }

    nav a[href="browse.html"] {
      color: #f97316;
    }
    
    nav a:hover {
      color: #f97316;
    }

/* ========== Search Section Wrapper ========== */
.search-section-wrapper {
  display: flex;
  justify-content: center;
  padding: 1rem;
}

/* ========== Search Section ========== */
.search-section {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: center;
  background-color: #222;
  color: #fff;
  padding: 1rem;
  border: 1px solid #444;
  border-radius: 8px;
  max-width: 1000px;
  width: 100%;
}

.search-section input,
.search-section select,
.search-section button {
  padding: 0.7rem;
  font-size: 1rem;
  border: none;
  border-radius: 8px;
  background-color: #000; /* Dark background */
  color: #fff;
  outline: none;
  box-shadow: 0 0 8px rgba(249, 115, 22, 0.3);
  transition: box-shadow 0.3s ease, transform 0.2s ease;
  min-width: 160px;
}

.search-section input:hover,
.search-section input:focus,
.search-section select:hover,
.search-section select:focus,
.search-section button:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 12px 4px rgba(249, 115, 22, 0.6);
}

#searchInput::placeholder {
  color: #ccc;
}

#searchInput:focus,
#typeSelect:focus,
#genre:focus {
  border-color: #f97316;
  box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.4);
}

#searchInput,
#typeSelect,
#genre {
  appearance: none;
  background-color: rgba(0, 0, 0, 0.6);
  color: #fff;
  border: 1px solid #2c2c2c;
  backdrop-filter: blur(4px);
}

#typeSelect option,
#genre option {
  background-color: #121212;
  color: #ffffff;
}

#searchBtn {
  background-color: #f97316;
  color: white;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(249, 115, 22, 0.3);
}

#searchBtn:hover {
  background-color: #fb923c;
  box-shadow: 0 6px 18px rgba(249, 115, 22, 0.5);
}

/* ========== Responsive Search ========== */
@media (max-width: 600px) {
  .search-section {
    flex-direction: column;
    align-items: stretch;
  }

  .search-section input,
  .search-section select,
  .search-section button {
    width: 100%;
  }
}

/* ========== Results Grid ========== */
#results {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 2rem;
  padding: 2rem;
} 
/* #results {
  display: flex;
  flex-wrap: wrap;
  gap: 2rem;
  padding: 2rem;
  justify-content: center;
} */


/* ========== Anime Card ========== */
.anime-card {
  background-color: #1f1f1f;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
  transition: transform 0.3s ease;
  cursor: pointer;
}

/* .anime-card {
  width: fit-content;
  max-width: 100%;
  background-color: #1f1f1f;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
  transition: transform 0.3s ease;
  cursor: pointer;
} */


.anime-card:hover {
  transform: scale(1.05);
}

.anime-card img {
  width: 100%;
  height: 320px;
  object-fit: cover;
}


/* .anime-card img {
  width: 220px; 
  height: 320px;
  object-fit: cover;
  display: block;
}
 */
.anime-info {
  padding: 1rem;
}

.anime-info h3 {
  font-size: 1.2rem;
  margin: 0.5rem 0;
  color: #f97316 !important;
}

.anime-info p {
  color: #ddd;
  margin: 4px 0;
  font-size: 14px;
}

.anime-info p strong {
  display: inline-block;
  min-width: 75px;
  color: #f97316;
  font-weight: 600;
}

.anime-card a,
.anime-card a:visited,
.anime-card a:hover,
.anime-card a:active {
  color: inherit;
  text-decoration: none;
}

/* ========== Genre Tags ========== */
.genre-tag {
  display: inline-block;
  background-color: #2d2d2d;
  color: #fff;
  padding: 3px 7px;
  margin: 4px 4px 0 0;
  border-radius: 5px;
  font-size: 12px;
  transition: background-color 0.3s ease;
}

.genre-tag:hover {
  background-color: #f97316;
  color: #fff;
  cursor: default;
}

/* ========== Footer ========== */
footer {
  text-align: center;
  padding: 1rem;
  background-color: #1f1f1f;
  font-size: 0.9rem;
}

#backToTop {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  width: 48px;
  height: 48px;
  font-size: 1.5rem;
  background: rgba(0, 0, 0, 0.4); /* transparent + blur */
  backdrop-filter: blur(6px);
  border: 2px solid #f97316;
  border-radius: 999px;
  color: #f97316;
  cursor: pointer;
  z-index: 1000;
  transition: background 0.3s, transform 0.3s;
}

#backToTop:hover {
  background: rgba(255, 121, 18, 0.1);
  transform: scale(1.1);
}

  #genre {
  background-color: #000;
  color: #fff;
  border: 1px solid #444;
  padding: 0.4rem 0.6rem;
  font-size: 1rem;
  border-radius: 6px;
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  width: 100%;
  max-width: 280px;
  cursor: pointer;
  overflow-y: auto;
}

/* Scrollbar for Chrome, Edge, and Safari */
#genre::-webkit-scrollbar {
  width: 10px;
}

#genre::-webkit-scrollbar-track {
  background: #2a2a2a;
}

#genre::-webkit-scrollbar-thumb {
  background-color: #f97316;
  border-radius: 10px;
}

/* Firefox scrollbar */
#genre {
  scrollbar-width: thin;
  scrollbar-color: #f97316 #2a2a2a;
}
/* Unified style for input, select, and button */
.search-section input,
.search-section select,
.search-section button {
  padding: 0.7rem 1rem;
  font-size: 1rem;
  border: none;
  border-radius: 10px; /* Rounded corners for all */
  background-color: #000;
  color: #fff;
  outline: none;
  box-shadow: 0 0 8px rgba(249, 115, 22, 0.3);
  transition: box-shadow 0.3s ease, transform 0.2s ease;
  min-width: 160px;
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
}

/* Hover & Focus effect */
.search-section input:hover,
.search-section input:focus,
.search-section select:hover,
.search-section select:focus,
.search-section button:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 12px 4px rgba(249, 115, 22, 0.6);
}

#searchInput::placeholder {
  color: #ccc;
}

/* Type & Genre Select Specific Styles */
#typeSelect,
#genre {
  background-color: #000;
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.15); /* subtle white border */
  padding: 0.6rem 1rem;
  font-size: 1rem;
  border-radius: 10px;
  width: 100%;
  max-width: 220px;
  cursor: pointer;
  overflow-y: auto;
  max-height: 200px;
  scrollbar-width: thin;
  scrollbar-color: #f97316 #2a2a2a;
  transition: border-color 0.3s;
}

#typeSelect:focus,
#genre:focus {
  border-color: #f97316;
}

/* Dropdown Scrollbar: WebKit */
#typeSelect::-webkit-scrollbar,
#genre::-webkit-scrollbar {
  width: 8px;
}

#typeSelect::-webkit-scrollbar-track,
#genre::-webkit-scrollbar-track {
  background: #2a2a2a;
}

#typeSelect::-webkit-scrollbar-thumb,
#genre::-webkit-scrollbar-thumb {
  background-color: #f97316;
  border-radius: 10px;
}

/* Dropdown Options */
#typeSelect option,
#genre option {
  background-color: #121212;
  color: #ffffff;
  padding: 10px;
  border-radius: 10px; /* Smooth corners inside dropdown */
  margin: 4px 0;
  font-size: 1rem;
}

/* Search Button */
#searchBtn {
  background-color: #f97316;
  color: white;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(249, 115, 22, 0.3);
}

#searchBtn:hover {
  background-color: #fb923c;
  box-shadow: 0 6px 18px rgba(249, 115, 22, 0.5);
}
  .card-img-wrapper {
  position: relative;
}

.tag-label {
  position: absolute;
  top: 6px;
  left: 6px;
  background: #000;
  color: #fff;
  padding: 2px 6px;
  font-size: 0.7rem;
  font-weight: bold;
  border-radius: 4px;
  text-transform: uppercase;
  z-index: 2;
  opacity: 0.9;
}

/* Optional: Color-coded based on type */
.tag-label.anime {
  background-color: #f97316;
}
.tag-label.manga {
  background-color: #34d399;
}
.tag-label.manhwa {
  background-color: #60a5fa;
}



</style>
</head>
<body>
  <header>
    <h1><a href="index.html" style="color: #f97316; text-decoration: none;">AnimeHub</a></h1>
    <nav>
      <a href="index.html">Anime</a>
      <a href="browse.html">Browse</a>
      <a href="calendar.html">Schedule</a>
      <a href="/manga.html" class="hover:text-purple-400">Manga</a>
      <a href="/manhwa.html" class="hover:text-purple-400">Manhwa</a>
      <a href="favorites.html" style="color:#f97316; font-weight:bold;">❤️</a>
    </nav>
  </header>

  <div class="search-section-wrapper">
  <div class="search-section">
    <input type="text" id="searchInput" placeholder="Search anime" />
    <select id="typeSelect">
      <option value="all">All</option>
      <option value="anime">Anime</option>
      <option value="manga">Manga</option>
      <option value="manhwa">Manhwa</option>
    </select>
    <select id="genre">
      <option value="">All Genres</option>
    </select>
    <button id="searchBtn">Search</button>
  </div>
</div>

  <div id="results">
    <!-- Anime cards will be injected here -->
  </div>

  <button id="backToTop" title="Back to top">⮝</button>

  <footer>
    &copy; 2025 AnimeHub. All rights reserved.
  </footer>

  <script src="browse.js"></script>
</body>
</html>
