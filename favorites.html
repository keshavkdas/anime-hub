<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Favorites</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=Poppins:wght@500&display=swap" rel="stylesheet"/>
  <style>
    body {
      background-color: #121212;
      color: white;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #1f1f1f;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }
    header h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 2rem;
      color: #f97316;
      margin: 0;
    }
    nav a {
      color: white;
      margin-left: 2rem;
      text-decoration: none;
      font-weight: 600;
    }
    nav a:hover {
      color: #f97316;
    }
    .container {
      padding: 2rem;
    }
    h2 {
      color: #f97316;
      margin-top: 2rem;
    }
    .carousel {
      display: flex;
      overflow-x: auto;
      gap: 1rem;
      padding-bottom: 1rem;
      scroll-snap-type: x mandatory;
    }
    .card {
      background-color: #1e1e1e;
      padding: 1rem;
      border-radius: 8px;
      text-align: center;
      flex: 0 0 auto;
      width: 160px;
      scroll-snap-align: start;
      position: relative;
    }
    .card:hover {
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
    }
    .card img {
      width: 100%;
      border-radius: 6px;
    }
    .card-title {
      margin-top: 0.5rem;
      font-weight: bold;
      color: #eee;
    }
    .remove-btn {
      position: absolute;
      top: 5px;
      right: 5px;
      background: red;
      border: none;
      color: white;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
<header>
  <h1>AnimeHub</h1>
  <nav>
    <a href="index.html">Anime</a>
    <a href="browse.html">Browse</a>
    <a href="manga.html">Manga</a>
    <a href="manhwa.html">Manhwa</a>
    <a href="favorites.html" style="color:#f97316; font-weight:bold;">❤️</a>
  </nav>
</header>

<div class="container">
  <h2>Favorite Anime</h2>
  <div class="carousel" id="animeFavorites"></div>

  <h2>Favorite Manga</h2>
  <div class="carousel" id="mangaFavorites"></div>

  <h2>Favorite Manhwa</h2>
  <div class="carousel" id="manhwaFavorites"></div>
</div>

<script>
function renderFavorites(key, containerId, detailsPage) {
  const list = JSON.parse(localStorage.getItem(key)) || [];
  const container = document.getElementById(containerId);

  if (!list.length) {
    container.innerHTML = `<p>No favorites yet.</p>`;
    return;
  }

  container.innerHTML = list.map((item, index) => `
    <div class="card">
      <button class="remove-btn" onclick="removeFavorite('${key}', ${index})">&times;</button>
      <img src="${item.imageUrl}" alt="${item.title}" onclick="location.href='${detailsPage}?id=${item.id}'" />
      <div class="card-title">${item.title}</div>
    </div>
  `).join('');
}

function removeFavorite(key, index) {
  const favs = JSON.parse(localStorage.getItem(key)) || [];
  favs.splice(index, 1);
  localStorage.setItem(key, JSON.stringify(favs));
  location.reload();
}

renderFavorites('animeFavorites', 'animeFavorites', 'anime-details.html');
renderFavorites('mangaFavorites', 'mangaFavorites', 'manga-details.html');
renderFavorites('manhwaFavorites', 'manhwaFavorites', 'manhwa-details.html');
</script>
</body>
</html>
