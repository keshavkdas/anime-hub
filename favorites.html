<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Favorites</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=Poppins:wght@500&display=swap" rel="stylesheet"/>
  <style>
    body {
      background-color: #121212;
      color: white;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #1f1f1f;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    header h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 2rem;
      color: #f97316;
      margin: 0;
      font-weight: 600;
    }

    nav a {
      color: white;
      margin-left: 2rem;
      text-decoration: none;
      font-weight: 600;
    }

    nav a:hover {
      color: #f97316;
    }

    .section {
      margin: 2rem;
    }

    .section h2 {
      color: #f97316;
      margin-bottom: 1rem;
    }

    .carousel {
      display: flex;
      overflow-x: auto;
      gap: 1rem;
      padding: 1rem;
      background-color: #000;
      border-radius: 10px;
      scroll-behavior: smooth;
    }

    .carousel::-webkit-scrollbar {
      height: 10px;
    }

    .carousel::-webkit-scrollbar-track {
      background: #222;
      border-radius: 10px;
    }

    .carousel::-webkit-scrollbar-thumb {
      background: #f97316;
      border-radius: 10px;
    }

    .favorite-item {
      flex: 0 0 auto;
      width: 180px;
      background-color: #1e1e1e;
      border-radius: 8px;
      padding: 0.5rem;
      text-align: center;
      position: relative;
    }

    .favorite-item img {
      width: 100%;
      border-radius: 6px;
      cursor: pointer;
    }

    .remove-btn {
      position: absolute;
      top: 5px;
      right: 8px;
      color: white;
      background-color: transparent;
      border: none;
      font-size: 18px;
      cursor: pointer;
    }

    .remove-btn:hover {
      color: #f97316;
    }

    .card-title {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      color: #eee;
    }
  </style>
</head>
<body>
<header>
  <h1>AnimeHub</h1>
  <nav>
    <a href="index.html">Anime</a>
    <a href="browse.html">Browse</a>
    <a href="manga.html">Manga</a>
    <a href="manhwa.html">Manhwa</a>
    <a href="favorites.html" style="color:#f97316; font-weight:bold;">❤️</a>
  </nav>
</header>

<div class="container">
  <div class="section">
    <h2>Favorite Anime</h2>
    <div class="carousel" id="animeFavorites"></div>
  </div>

  <div class="section">
    <h2>Favorite Manga</h2>
    <div class="carousel" id="mangaFavorites"></div>
  </div>

  <div class="section">
    <h2>Favorite Manhwa</h2>
    <div class="carousel" id="manhwaFavorites"></div>
  </div>
</div>

<script>
function renderFavorites(key, containerId, detailsPage) {
  const list = JSON.parse(localStorage.getItem(key)) || [];
  const container = document.getElementById(containerId);

  if (!list.length) {
    container.innerHTML = `<p>No favorites yet.</p>`;
    return;
  }

  container.innerHTML = list.map((item, index) => `
    <div class="favorite-item">
      <button class="remove-btn" onclick="removeFavorite('${key}', ${index})">&times;</button>
      <img src="${item.imageUrl}" alt="${item.title}" onclick="location.href='${detailsPage}?id=${item.id}'" />
      <div class="card-title">${item.title}</div>
    </div>
  `).join('');
}

function removeFavorite(key, index) {
  const favs = JSON.parse(localStorage.getItem(key)) || [];
  favs.splice(index, 1);
  localStorage.setItem(key, JSON.stringify(favs));
  location.reload();
}

// Load all favorites
renderFavorites('animeFavorites', 'animeFavorites', 'anime-details.html');
renderFavorites('mangaFavorites', 'mangaFavorites', 'manga-details.html');
renderFavorites('manhwaFavorites', 'manhwaFavorites', 'manhwa-details.html');
</script>
</body>
</html>
