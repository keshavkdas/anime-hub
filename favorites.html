<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <title>My Anime Favorites</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=Poppins:wght@600&display=swap');

    html, body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    header {
      background-color: #1f1f1f;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    header h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 2rem;
      color: #f97316;
      margin: 0;
      font-weight: 1000;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    nav a {
      color: white;
      font-family: 'Poppins', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    nav a:last-child {
      font-size: 1.3rem;
    }

    nav a:hover {
      color: #f97316;
    }

    h2 {
      font-family: 'Oswald', sans-serif;
      font-size: 1.8rem;
      color: #f97316;
      margin: 2rem 0 1rem;
      padding-left: 1rem;
    }

    .favorites-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
      padding: 0 1rem;
    }

    @media (max-width: 768px) {
      .favorites-list {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      .favorites-list {
        grid-template-columns: 1fr;
      }
    }

    .fav-card {
      background-color: #222;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.5rem;
      position: relative;
      transition: transform 0.2s ease;
      cursor: pointer;
    }

    .fav-card:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(255, 121, 18, 0.8);
    }

    .fav-card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 8px;
    }

    .fav-card h3 {
      margin: 0.5rem 0 0;
      font-size: 1.1rem;
      color: #f97316;
      text-align: center;
    }

    .remove-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background-color: #2c2c2c;
      border: none;
      color: #f44336;
      font-size: 1.1rem;
      padding: 0.4rem;
      border-radius: 50%;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    }

    .remove-btn:hover {
      background-color: #f44336;
      color: white;
    }

    .empty-msg {
      text-align: center;
      color: #888;
      margin: 2rem 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>AnimeHub</h1>
    <nav>
      <a href="index.html">Anime</a>
      <a href="browse.html">Browse</a>
      <a href="manga.html">Manga</a>
      <a href="manhwa.html">Manhwa</a>
      <a href="favorites.html" style="color:#f97316; font-weight:bold;">❤️</a>
    </nav>
  </header>

  <main>
    <h2>Anime Favorites</h2>
    <div id="animeFavorites" class="favorites-list"></div>
    <p id="animeEmpty" class="empty-msg">No anime favorited yet.</p>

    <h2>Manga Favorites</h2>
    <div id="mangaFavorites" class="favorites-list"></div>
    <p id="mangaEmpty" class="empty-msg">No manga favorited yet.</p>

    <h2>Manhwa Favorites</h2>
    <div id="manhwaFavorites" class="favorites-list"></div>
    <p id="manhwaEmpty" class="empty-msg">No manhwa favorited yet.</p>
  </main>

  <script>
  function renderFavorites(type, key, containerId, emptyId) {
    let favs = JSON.parse(localStorage.getItem(key)) || [];
    const container = document.getElementById(containerId);
    const emptyMsg = document.getElementById(emptyId);

    container.innerHTML = "";

    if (favs.length === 0) {
      container.style.display = "none";
      emptyMsg.style.display = "block";
      return;
    }

    container.style.display = "grid";
    emptyMsg.style.display = "none";

    favs.forEach((item) => {
      const card = document.createElement("div");
      card.className = "fav-card";

      card.innerHTML = `
        <img src="${item.imageUrl}" alt="${item.title}" onerror="this.src='fallback.jpg';">
        <h3>${item.title}</h3>
        <button class="remove-btn" title="Remove from favorites">❌</button>
      `;

      const removeBtn = card.querySelector(".remove-btn");

      removeBtn.addEventListener("click", (e) => {
        e.stopPropagation(); // prevent card click
        favs = favs.filter(f => f.id !== item.id);
        localStorage.setItem(key, JSON.stringify(favs));
        renderFavorites(type, key, containerId, emptyId);
      });

      card.addEventListener("click", (e) => {
        if (!e.target.classList.contains("remove-btn")) {
          window.location.href = `${type}-details.html?id=${item.id}`;
        }
      });

      container.appendChild(card);
    });
  }

  document.addEventListener("DOMContentLoaded", () => {
    renderFavorites("anime", "animeFavorites", "animeFavorites", "animeEmpty");
    renderFavorites("manga", "mangaFavorites", "mangaFavorites", "mangaEmpty");
    renderFavorites("manga", "manhwaFavorites", "manhwaFavorites", "manhwaEmpty");
  });
</script>
  </script>
</body>
</html>
