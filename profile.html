<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Profile – AnimeHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: #0d1117;
      color: #f0f0f0;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 24px;
      text-decoration: none;
      color: #ff6600;
      z-index: 10;
    }

    .banner {
      width: 100%;
      height: 200px;
      background: linear-gradient(to right, #ff6600, #ff9900);
      position: relative;
    }
    .level-bar-container {
      margin: -30px auto 20px auto;
      max-width: 600px;
      padding: 10px 20px;
      background: #161b22;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(255, 102, 0, 0.3);
      text-align: center;
    }

    .level-title {
      font-size: 20px;
      color: #f97316;
      margin-bottom: 10px;
    }

    .level-progress-bar {
      height: 24px;
      background: #2d3748;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    .level-fill {
      height: 100%;
      background: linear-gradient(to right, #f97316, #ff6600);
      transition: width 0.5s ease;
    }

    .level-number {
      margin-top: 8px;
      font-weight: bold;
      font-size: 16px;
    }

    .badge-title {
      font-size: 14px;
      color: #00ffcc;
      margin-top: 5px;
    }

    .profile-level-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 30px;
  margin-top: -60px;
  flex-wrap: wrap;
}

.profile-avatar {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 5px solid #0d1117;
  background-color: #fff;
  object-fit: cover;
  z-index: 5;
  position: relative;
  left: 0;
  transform: none;
}

.username-display {
  text-align: center;
  margin-top: 20px;
  font-size: 28px;
  font-weight: bold;
  color: #ff6600;
}
    .main-content {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .section {
      background: #161b22;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 30px;
      box-shadow: 0 0 15px rgba(255, 102, 0, 0.2);
    }

    .section h2 {
      color: #f97316;
      margin-bottom: 15px;
    }

    .stat-grid {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .stat-box {
      flex: 1;
      min-width: 200px;
      padding: 15px;
      border-radius: 8px;
      color: white;
      font-weight: bold;
    }

    .anime-box { background-color: #ff6600; }
    .manga-box { background-color: #40e0d0; }
    .manhwa-box { background-color: #a259ff; }

    .graph-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    canvas {
      width: 100% !important;
      height: 250px !important;
      background: #0d1117;
      padding: 10px;
      border-radius: 8px;
      animation: slideUp 1s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .achievements-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .achievement-card {
      background: #0d1117;
      border: 2px solid #ff6600;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      font-size: 16px;
      transition: transform 0.3s;
      position: relative;
      opacity: 1;
    }

    .achievement-card.locked {
      filter: grayscale(100%);
      opacity: 0.5;
    }

    .achievement-card:hover {
      transform: scale(1.05);
    }

    .emoji {
      font-size: 30px;
      display: block;
      margin-bottom: 8px;
      transition: transform 0.3s;
    }

    .achievement-card:hover .emoji {
      animation: bounce 0.5s ease-in-out infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-5px); }
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #1f2937;
      color: white;
      padding: 15px 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px #ff6600;
      z-index: 999;
      display: none;
    }
  </style>
</head>

  const user = JSON.parse(localStorage.getItem("user"));
  const profile = JSON.parse(localStorage.getItem("profile"));
  const avatar = document.getElementById("profile-avatar");
  const uname = document.getElementById("profile-username");

  if (!user || !profile) window.location.href = "login.html";
  avatar.src = profile.avatar || "avatar.jpg";
  uname.textContent = profile.username || "Guest";

  const parseDates = (list) => {
    const map = {};
    list.forEach(item => {
      const d = item.date || new Date().toISOString().split('T')[0];
      map[d] = (map[d] || 0) + 1;
    });
    return map;
  };

  const userKey = user.uid;
  let favData = { anime: [], manga: [], manhwa: [] };

  async function loadFavorites() {
    try {
      let resp = await fetch(`/api/user/${userKey}/favorites`);
      if (!resp.ok) throw new Error('API failed');
      favData = await resp.json();
    } catch (e) {
      ['anime', 'manga', 'manhwa'].forEach(type => {
        favData[type] = JSON.parse(localStorage.getItem(`${type}Favorites_${userKey}`)) || [];
      });
    }
  }

  function updateDailyStreak() {
    const lastDate = localStorage.getItem('lastFavDate');
    const today = new Date().toISOString().split('T')[0];
    const streak = Number(localStorage.getItem('dailyStreak')) || 0;

    if (lastDate === today) return streak;

    const yesterday = new Date(Date.now() - 864e5).toISOString().split('T')[0];
    const newStreak = (lastDate === yesterday) ? streak + 1 : 1;
    localStorage.setItem('lastFavDate', today);
    localStorage.setItem('dailyStreak', newStreak);
    return newStreak;
  }

  const buildTimeSeriesChart = (ctxId, dataMap, label, color) => {
    const today = new Date();
    const labels = Array.from({ length: 30 }, (_, i) => {
      const date = new Date(today);
      date.setDate(date.getDate() - (29 - i));
      return date.toISOString().split('T')[0];
    });

    const data = labels.map(date => dataMap[date] || 0);

    new Chart(document.getElementById(ctxId), {
      type: 'bar',
      data: {
        labels,
        datasets: [{ label, data, backgroundColor: color }]
      },
      options: {
        scales: {
          y: { beginAtZero: true, ticks: { color: '#fff' } },
          x: { ticks: { color: '#fff' } }
        },
        plugins: {
          legend: { labels: { color: '#fff' } }
        }
      }
    });
  };

    function updateLevelUI(unlocked) {
      const levelNumber = Math.min(10, Math.floor(unlocked.length / 4) + 1);
      const currentExp = unlocked.length % 4;
      const percent = (currentExp / 4) * 100;
      document.getElementById("level-fill").style.width = `${percent}%`;
      document.getElementById("level-number").textContent = `Level ${levelNumber}`;

      const badge = document.getElementById("badge-title");
      if (levelNumber >= 10) badge.textContent = "🏆 Title: Master";
      else if (levelNumber >= 8) badge.textContent = "⚔️ Title: Novice";
      else if (levelNumber >= 5) badge.textContent = "🎓 Title: Apprentice";
      else badge.textContent = "";
    }
  async function initProfile() {
    await loadFavorites();

    const stats = {
      anime: favData.anime.length,
      manga: favData.manga.length,
      manhwa: favData.manhwa.length,
      total: favData.anime.length + favData.manga.length + favData.manhwa.length,
      streak: updateDailyStreak()
    };

    ["anime", "manga", "manhwa"].forEach(type => {
      document.getElementById(`${type}-total`).textContent = favData[type].length;
      document.getElementById(`${type}-last`).textContent = favData[type].length ? favData[type][favData[type].length - 1].title : "—";
    });

    const animeMap = parseDates(favData.anime);
    const mangaMap = parseDates(favData.manga);
    const manhwaMap = parseDates(favData.manhwa);
    const combinedMap = {};
    [animeMap, mangaMap, manhwaMap].forEach(map => {
      for (const key in map) combinedMap[key] = (combinedMap[key] || 0) + map[key];
    });

    buildTimeSeriesChart("chart-anime", animeMap, "Anime Favorites", "#ff6600");
    buildTimeSeriesChart("chart-manga", mangaMap, "Manga Favorites", "#40e0d0");
    buildTimeSeriesChart("chart-manhwa", manhwaMap, "Manhwa Favorites", "#a259ff");
    buildTimeSeriesChart("chart-combined", combinedMap, "All Favorites", "#f97316");

    const achievements = generateAchievements();
    const unlocked = achievements.filter(a => a.condition(stats)).map(a => a.id);
    updateLevelUI(unlocked);
    localStorage.setItem("unlockedAchievements", JSON.stringify(unlocked));
    const seen = JSON.parse(localStorage.getItem("seenAchievements") || "[]");
    const newOnes = unlocked.filter(id => !seen.includes(id));

    const container = document.getElementById("achievements");
    achievements.forEach(a => {
      const has = unlocked.includes(a.id);
      const progress = has ? `${a.target}` : `${stats[a.field]}/${a.target}`;
      container.insertAdjacentHTML('beforeend',
        `<div class="achievement-card${has ? '' : ' locked'}">
          <span class="emoji" title="${a.desc} (${progress})">${a.emoji}</span>
          <div title="${a.desc}">${a.title}</div>
        </div>`
      );
    });

    if (newOnes.length) {
      const t = document.getElementById("toast");
      t.textContent = "🏆 New Achievement Unlocked!";
      t.style.display = "block";
      setTimeout(() => t.style.display = "none", 4000);
      localStorage.setItem("seenAchievements", JSON.stringify([...seen, ...newOnes]));
    }
  }
