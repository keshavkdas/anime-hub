<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Profile – AnimeHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: #0d1117;
      color: #f0f0f0;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }

    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 24px;
      text-decoration: none;
      color: #ff6600;
    }

    .banner {
      width: 100%;
      height: 180px;
      background: linear-gradient(to right, #ff6600, #ff9900);
      border-bottom: 3px solid #ff6600;
      position: relative;
    }

    .profile-avatar {
      position: absolute;
      left: 30px;
      bottom: -60px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid #0d1117;
      background: #fff;
      object-fit: cover;
    }

    .username-display {
      margin-left: 170px;
      margin-top: 20px;
      font-size: 28px;
      font-weight: bold;
      color: #ff6600;
    }

    .main-content {
      max-width: 960px;
      margin: 80px auto 40px;
      padding: 0 20px;
    }

    .section {
      background: #161b22;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 30px;
      box-shadow: 0 0 15px rgba(255, 102, 0, 0.2);
    }

    .section h2 {
      color: #f97316;
      margin-bottom: 15px;
    }

    .stat-grid {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .stat-box {
      flex: 1;
      min-width: 200px;
      background: #0d1117;
      padding: 15px;
      border: 1px solid #222;
      border-radius: 8px;
    }

    .stat-box h3 {
      margin: 0 0 10px;
      color: #ffa94d;
    }

    .stat-box p {
      margin: 5px 0;
    }

    canvas {
      max-width: 100%;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #888;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      .username-display {
        margin-left: 0;
        margin-top: 70px;
        text-align: center;
      }

      .profile-avatar {
        left: calc(50% - 60px);
      }
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-btn">←</a>
  <div class="banner"></div>
  <img id="profile-avatar" class="profile-avatar" src="avatar.jpg" alt="Avatar" />
  <div class="username-display" id="profile-username">Username</div>

  <div class="main-content">
    <div class="section">
      <h2>My Stats</h2>
      <div class="stat-grid">
        <div class="stat-box">
          <h3>Anime</h3>
          <p><strong>Total:</strong> <span id="anime-total">0</span></p>
          <p><strong>Last Added:</strong> <span id="anime-last">—</span></p>
        </div>
        <div class="stat-box">
          <h3>Manga</h3>
          <p><strong>Total:</strong> <span id="manga-total">0</span></p>
          <p><strong>Last Added:</strong> <span id="manga-last">—</span></p>
        </div>
        <div class="stat-box">
          <h3>Manhwa</h3>
          <p><strong>Total:</strong> <span id="manhwa-total">0</span></p>
          <p><strong>Last Added:</strong> <span id="manhwa-last">—</span></p>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>Favorites Distribution</h2>
      <canvas id="favoritesChart"></canvas>
    </div>

    <div class="section">
      <h2>Achievements</h2>
      <ul>
        <li>🎉 First Favorite Added</li>
        <li>🔥 10+ Anime Favorited</li>
        <li>📖 Manga Explorer</li>
        <li>🌍 Manhwa Enthusiast</li>
      </ul>
    </div>
  </div>

  <footer>
    &copy; 2025 AnimeHub. All rights reserved.
  </footer>

  <script>
    const user = JSON.parse(localStorage.getItem("user"));
    const profile = JSON.parse(localStorage.getItem("profile"));
    const avatar = document.getElementById("profile-avatar");
    const uname = document.getElementById("profile-username");

    if (!user || !profile) {
      window.location.href = "login.html";
    }

    avatar.src = profile.avatar || "avatar.jpg";
    uname.textContent = profile.username || "Guest";

    const stats = {
      anime: JSON.parse(localStorage.getItem(`animeFavorites_${user.uid}`)) || [],
      manga: JSON.parse(localStorage.getItem(`mangaFavorites_${user.uid}`)) || [],
      manhwa: JSON.parse(localStorage.getItem(`manhwaFavorites_${user.uid}`)) || []
    };

    const setStats = (type) => {
      document.getElementById(`${type}-total`).textContent = stats[type].length;
      document.getElementById(`${type}-last`).textContent = stats[type].length
        ? stats[type][stats[type].length - 1].title
        : "—";
    };

    ["anime", "manga", "manhwa"].forEach(setStats);

    // Chart
    const ctx = document.getElementById('favoritesChart').getContext('2d');
    new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['Anime', 'Manga', 'Manhwa'],
        datasets: [{
          label: 'Favorites Count',
          data: [stats.anime.length, stats.manga.length, stats.manhwa.length],
          backgroundColor: ['#ff6600', '#ffa94d', '#ffcc80'],
          borderColor: '#161b22',
          borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: {
            labels: {
              color: '#fff'
            }
          }
        }
      }
    });
  </script>
</body>
</html>
