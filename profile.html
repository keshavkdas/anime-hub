<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Your Profile – AnimeHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #0f0f0f;
      color: #f0f0f0;
    }

    header {
      background: #1c1c1c;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #222;
    }

    header h1 {
      color: #ff6600;
      font-size: 22px;
      margin: 0;
    }

    .banner {
      height: 160px;
      background: url('https://images.unsplash.com/photo-1603312409933-d5d504b9a4ff?fit=crop&w=1280&q=80') center/cover no-repeat;
      position: relative;
    }

    .profile-header {
      display: flex;
      align-items: center;
      padding: 0 30px;
      margin-top: -50px;
      gap: 20px;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid #ff6600;
      background-color: #000;
      object-fit: cover;
    }

    .username-block {
      display: flex;
      flex-direction: column;
    }

    .username-block h2 {
      font-size: 22px;
      margin: 0;
      color: #fff;
    }

    .username-block .badge {
      color: #ffcc00;
      font-size: 14px;
      margin-top: 4px;
    }

    .main {
      display: flex;
      max-width: 1000px;
      margin: 30px auto;
      gap: 20px;
      padding: 0 20px;
    }

    .sidebar {
      width: 220px;
      background-color: #161b22;
      border-radius: 8px;
      padding: 16px;
    }

    .sidebar h3 {
      color: #ff6600;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .sidebar li {
      padding: 10px;
      color: #ccc;
      font-size: 14px;
      cursor: pointer;
      border-radius: 4px;
    }

    .sidebar li:hover {
      background-color: #262b30;
      color: #ff6600;
    }

    .content {
      flex: 1;
      background-color: #161b22;
      border-radius: 8px;
      padding: 20px;
    }

    .content h3 {
      color: #ff6600;
      margin-bottom: 20px;
    }

    .profile-info {
      display: grid;
      grid-template-columns: 150px 1fr;
      row-gap: 16px;
    }

    .profile-info .label {
      color: #999;
      font-weight: bold;
    }

    .profile-info .value {
      color: #f0f0f0;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #ff6600;
      color: white;
      padding: 12px 20px;
      border-radius: 5px;
      font-size: 15px;
      display: none;
      z-index: 1000;
    }

    @media (max-width: 768px) {
      .main {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
      }

      .profile-info {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>AnimeHub</h1>
  </header>

  <div class="banner"></div>

  <div class="profile-header">
    <img src="avatar.jpg" alt="Avatar" class="avatar" id="profile-avatar" />
    <div class="username-block">
      <h2 id="profile-username">Loading...</h2>
      <span class="badge">🌟 Premium Member</span>
    </div>
  </div>

  <div class="main">
    <div class="sidebar">
      <h3>General</h3>
      <ul>
        <li>Membership Plan</li>
        <li>Preferences</li>
        <li>Email Notifications</li>
        <li>Change Email</li>
        <li>Change Password</li>
        <li>My Devices</li>
      </ul>
    </div>

    <div class="content">
      <h3>Profile Information</h3>
      <div class="profile-info">
        <div class="label">Username</div>
        <div class="value" id="val-username"></div>

        <div class="label">First Name</div>
        <div class="value" id="val-first"></div>

        <div class="label">Last Name</div>
        <div class="value" id="val-last"></div>

        <div class="label">Date of Birth</div>
        <div class="value" id="val-dob"></div>

        <div class="label">Email</div>
        <div class="value" id="val-email"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">This action requires login</div>

  <script>
    const user = JSON.parse(localStorage.getItem("user"));
    const profile = JSON.parse(localStorage.getItem("profile"));

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.style.display = "block";
      setTimeout(() => toast.style.display = "none", 3000);
    }

    if (!user || !profile) {
      showToast("This action requires login");
      setTimeout(() => window.location.href = "index.html", 1500);
    } else {
      document.getElementById("profile-avatar").src = profile.avatar;
      document.getElementById("profile-username").textContent = profile.username;
      document.getElementById("val-username").textContent = profile.username;
      document.getElementById("val-first").textContent = profile.first;
      document.getElementById("val-last").textContent = profile.last;
      document.getElementById("val-dob").textContent = profile.dob;
      document.getElementById("val-email").textContent = user.email;
    }
  </script>
</body>
</html>
