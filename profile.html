<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Profile – AnimeHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      background-color: #0d1117;
      color: #f0f0f0;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #161b22;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      margin: 0;
      color: #ff6600;
      font-size: 22px;
    }

    nav a {
      margin-left: 20px;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }

    .profile-container {
      max-width: 960px;
      margin: 40px auto;
      background: #161b22;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(255, 102, 0, 0.3);
      overflow: hidden;
      display: flex;
      flex-direction: row;
    }

    .profile-sidebar {
      background: #0d1117;
      width: 280px;
      padding: 20px;
      border-right: 1px solid #222;
    }

    .profile-sidebar img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #ff6600;
      margin: 0 auto;
      display: block;
    }

    .username {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-top: 10px;
      color: #ff6600;
    }

    .profile-main {
      flex: 1;
      padding: 30px;
    }

    .profile-main h2 {
      color: #ff6600;
      margin-bottom: 15px;
    }

    .stat-section {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .stat-box {
      flex: 1;
      min-width: 220px;
      background: #0d1117;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #222;
    }

    .stat-box h3 {
      color: #f97316;
      margin-bottom: 10px;
    }

    .stat-box p {
      font-size: 14px;
      margin: 6px 0;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #888;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      .profile-container {
        flex-direction: column;
      }

      .profile-sidebar {
        border-right: none;
        border-bottom: 1px solid #222;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>AnimeHub</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="favorites.html">Favorites</a>
      <a href="settings.html">Settings</a>
    </nav>
  </header>

  <div class="profile-container">
    <div class="profile-sidebar">
      <img id="profile-avatar" src="avatar.jpg" alt="Avatar" />
      <div class="username" id="profile-username">Username</div>
    </div>
    <div class="profile-main">
      <h2>My Stats</h2>
      <div class="stat-section">
        <div class="stat-box">
          <h3>Anime</h3>
          <p><strong>Total:</strong> <span id="anime-total">0</span></p>
          <p><strong>Last Added:</strong> <span id="anime-last">—</span></p>
        </div>
        <div class="stat-box">
          <h3>Manga</h3>
          <p><strong>Total:</strong> <span id="manga-total">0</span></p>
          <p><strong>Last Added:</strong> <span id="manga-last">—</span></p>
        </div>
        <div class="stat-box">
          <h3>Manhwa</h3>
          <p><strong>Total:</strong> <span id="manhwa-total">0</span></p>
          <p><strong>Last Added:</strong> <span id="manhwa-last">—</span></p>
        </div>
      </div>
    </div>
  </div>

  <footer>
    &copy; 2025 AnimeHub. All rights reserved.
  </footer>

  <script>
    const user = JSON.parse(localStorage.getItem("user"));
    const profile = JSON.parse(localStorage.getItem("profile"));
    const avatar = document.getElementById("profile-avatar");
    const uname = document.getElementById("profile-username");

    if (!user || !profile) {
      window.location.href = "login.html";
    }

    avatar.src = profile.avatar || "avatar.jpg";
    uname.textContent = profile.username || "Guest";

    function loadStats(type) {
      const key = `${type}Favorites_${user.uid}`;
      const data = JSON.parse(localStorage.getItem(key)) || [];
      document.getElementById(`${type}-total`).textContent = data.length;
      document.getElementById(`${type}-last`).textContent = data.length
        ? data[data.length - 1].title
        : "—";
    }

    ["anime", "manga", "manhwa"].forEach(loadStats);
  </script>
</body>
</html>
