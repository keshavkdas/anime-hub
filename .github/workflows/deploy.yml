name: Deploy AnimeHub to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Create .env file
        run: echo "VITE_MANGADEX_SECRET=${{ secrets.VITE_MANGADEX_SECRET }}" > .env


      - name: Build (if needed)
        run: |
          echo "<html><body><h1>AnimeHub Calendar</h1></body></html>" > index.html  # replace with your build step if needed

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.GH_DEPLOY_TOKEN }}
          publish_dir: .  # change to ./dist if you're using Vite or build tools
