<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manhwa Details</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=Poppins:wght@500&display=swap" rel="stylesheet"/>
  <style>
    body {
      margin: 0;
      background-color: #121212;
      font-family: 'Poppins', sans-serif;
      color: white;
    }
    header {
      background-color: #1f1f1f;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }
    header h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 2rem;
      color: #f97316;
      margin: 0;
      font-weight: 600;
    }
    nav a {
      color: white;
      margin-left: 2rem;
      text-decoration: none;
      font-weight: 600;
    }
    nav a:hover {
      color: #f97316;
    }
    .container {
      padding: 2rem;
    }
    .anime-detail-header {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
    }
    .anime-image-container {
      position: relative;
    }
    .anime-image-container img {
      width: 250px;
      border-radius: 10px;
    }
    .favorite-bubble {
      width: 35px;
      height: 35px;
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 50%;
      padding: 10px;
      font-size: 24px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      z-index: 2;
      text-align: center;
    }
    .favorite-bubble:hover {
      transform: scale(1.1);
      box-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
    }
    .favorite-bubble.active {
      color: #ff4d4d;
      text-shadow: 0 0 8px #ff4d4d;
    }
    .anime-info h1 {
      color: #f97316;
      margin-top: 0;
    }
    .anime-info p {
      margin: 0.5rem 0;
      color: #ccc;
    }
    .section {
      margin-top: 3rem;
    }
    .section h3 {
      margin-bottom: 1rem;
      color: #f97316;
    }
    .character-list,
    .related-list,
    .chapter-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
    }
    .character-bubble,
    .related,
    .chapter {
      background-color: #1e1e1e;
      padding: 1rem;
      border-radius: 8px;
      text-align: center;
    }
    .character-bubble img {
      width: 100%;
      border-radius: 8px;
    }
    .character-name {
      margin-top: 0.5rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
<header>
  <h1>AnimeHub</h1>
  <nav>
    <a href="index.html">Anime</a>
    <a href="browse.html">Browse</a>
    <a href="/manga.html">Manga</a>
    <a href="/manhwa.html">Manhwa</a>
    <a href="favorites.html" style="color:#f97316; font-weight:bold;">❤️</a>
  </nav>
</header>

<div class="container">
  <div id="manhwaDetails"></div>

  <div class="section">
    <h3>Characters</h3>
    <div class="character-list" id="characterList"></div>
  </div>

  <div class="section">
    <h3>Related Works</h3>
    <div class="related-list" id="relatedList"></div>
  </div>

  <div class="section">
    <h3>Chapters</h3>
    <div class="chapter-list" id="chapterList"></div>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const manhwaId = params.get("id");

let type = 'manhwa'; // default
let favKey = 'manhwaFavorites';

function isInFavorites(id, favKey) {
  const favs = JSON.parse(localStorage.getItem(favKey)) || [];
  return favs.some(fav => String(fav.id) === String(id));
}

function addToFavorites(id, title, imageUrl, favKey, type) {
  const favs = JSON.parse(localStorage.getItem(favKey)) || [];
  const index = favs.findIndex(fav => String(fav.id) === String(id));
  const heartBtn = document.querySelector(`.favorite-bubble[data-id="${id}"]`);

  if (index > -1) {
    favs.splice(index, 1);
    if (heartBtn) {
      heartBtn.textContent = '❤️';
      heartBtn.classList.remove('active');
    }
  } else {
    favs.push({ id: String(id), title: title.trim(), imageUrl: imageUrl.trim(), type });
    if (heartBtn) {
      heartBtn.textContent = '💖';
      heartBtn.classList.add('active');
    }
  }

  localStorage.setItem(favKey, JSON.stringify(favs));
}

function markFavoriteBubble(id, favKey) {
  const heartBtn = document.querySelector(`.favorite-bubble[data-id="${id}"]`);
  if (!heartBtn) return;

  const isFav = isInFavorites(id, favKey);
  heartBtn.classList.toggle('active', isFav);
  heartBtn.textContent = isFav ? '💖' : '❤️';
}

async function fetchManhwaDetails() {
  const container = document.getElementById("manhwaDetails");
  container.innerHTML = `<p>Loading details...</p>`;

  try {
    const res = await fetch(`https://api.jikan.moe/v4/manga/${mangaId}/full`);
    const { data } = await res.json();
    const img = data.images.jpg.image_url;

    // ✅ Determine type and favKey
    const isManhwa = data.genres.some(g => g.name.toLowerCase() === 'manhwa');
    type = isManhwa ? 'manhwa' : 'manga';
    favKey = isManhwa ? 'manhwaFavorites' : 'mangaFavorites';

    container.innerHTML = `
      <div class="anime-detail-header">
        <div class="anime-image-container">
          <img src="${img}" alt="${data.title}"/>
          <div class="favorite-bubble" data-id="${data.mal_id}">❤️</div>
        </div>
        <div class="anime-info">
          <h1>${data.title}</h1>
          <p><strong>Synopsis:</strong> ${data.synopsis || 'No synopsis available.'}</p>
          <p><strong>Type:</strong> ${data.type}</p>
          <p><strong>Status:</strong> ${data.status}</p>
          <p><strong>Chapters:</strong> ${data.chapters || 'Unknown'}</p>
          <p><strong>Score:</strong> ${data.score || 'N/A'}</p>
          <p><strong>Published:</strong> ${data.published.string}</p>
          <p><strong>Genres:</strong> ${data.genres.map(g => g.name).join(', ')}</p>
        </div>
      </div>`;

    const heartBtn = document.querySelector(`.favorite-bubble[data-id="${data.mal_id}"]`);
    heartBtn.addEventListener('click', () => {
      addToFavorites(data.mal_id, data.title, img, favKey, type);
    });

    markFavoriteBubble(data.mal_id, favKey);

  } catch (err) {
    container.innerHTML = `<p>Error loading manhwa details.</p>`;
  }
}

async function fetchCharacters() {
  const res = await fetch(`https://api.jikan.moe/v4/manga/${mangaId}/characters`);
  const { data } = await res.json();
  const container = document.getElementById("characterList");
  container.innerHTML = data.slice(0, 10).map(char => `
    <div class="character-bubble">
      <a href="character.html?id=${char.character.mal_id}">
        <img src="${char.character.images.jpg.image_url}" alt="${char.character.name}">
      </a>
      <div class="character-name">${char.character.name}</div>
    </div>
  `).join('');
}

async function fetchRelated() {
  const res = await fetch(`https://api.jikan.moe/v4/manga/${mangaId}/relations`);
  const { data } = await res.json();
  const container = document.getElementById("relatedList");
  container.innerHTML = data.flatMap(rel => rel.entry.map(item => `
    <div class="related">
      <strong>${item.name}</strong>
      <p>${rel.relation}</p>
    </div>
  `)).join('');
}

async function fetchChapters() {
  const res = await fetch(`https://api.jikan.moe/v4/manga/${mangaId}/chapters`);
  const { data } = await res.json();
  const container = document.getElementById("chapterList");
  container.innerHTML = data.slice(0, 20).map(ch => `
    <div class="chapter">
      <strong>Chapter ${ch.mal_id}</strong>
      <p>${ch.title || 'Untitled'}</p>
    </div>
  `).join('');
}

fetchManhwaDetails();
fetchCharacters();
fetchRelated();
fetchChapters();
</script>


</body>
</html>
